<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>iReport Wireframe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700&display=swap">
<style>
/* Layout: app shell — process sidebar grouped by business area, worklist in the middle, record drawer on the right. */
:root{--bg:#F3F4FA;--card:#FFFFFF;--ink:#141A33;--muted:#5F6584;--line:#E1E3EE;--soft:#EEF0F8;--pri:#5B3FD9;--pri-ink:#FFFFFF;--hl:#FFC83D;
  --ok:#147a4b;--ok-bg:#E3F5EC;--warn:#8a5a00;--warn-bg:#FFF2D6;--bad:#B3261E;--bad-bg:#FCE4E2;--info-bg:#ECE8FD;
  --display:'Alexandria',system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;--body:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121528;--card:#1B1F38;--ink:#E8EAF6;--muted:#A3A8C6;--line:#2C3150;--soft:#232846;--pri:#A996EE;--pri-ink:#121528;--ok:#6fd3a0;--ok-bg:#16332a;--warn:#f3c56b;--warn-bg:#3a2f14;--bad:#f2a19b;--bad-bg:#3d1d1c;--info-bg:#2a2650;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121528;--card:#1B1F38;--ink:#E8EAF6;--muted:#A3A8C6;--line:#2C3150;--soft:#232846;--pri:#A996EE;--pri-ink:#121528;--ok:#6fd3a0;--ok-bg:#16332a;--warn:#f3c56b;--warn-bg:#3a2f14;--bad:#f2a19b;--bad-bg:#3d1d1c;--info-bg:#2a2650;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.app{display:grid;grid-template-columns:268px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100%}
.top{grid-column:1/-1;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--card);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:8px;font:700 18px/1 var(--display)}
.brand small{font:600 11px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:var(--hl);padding:3px 7px;border-radius:99px}
.top .sp{flex:1}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.who select{max-width:260px}
.menu{display:none}
.side{overflow:auto;border-right:1px solid var(--line);background:var(--card);padding:12px 10px 40px}
.side h4{margin:14px 8px 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.nav{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:8px;cursor:pointer;color:var(--ink)}
.nav:hover{background:var(--soft)}
.nav.on{background:var(--info-bg);color:var(--pri);font-weight:600}
.nav .code{font:600 11px/1 var(--mono);color:var(--muted);min-width:30px}
.nav.on .code{color:var(--pri)}
.nav .n{margin-left:auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
main{overflow:auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.eyebrow{margin:0;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--pri)}
h1{margin:2px 0 0;font:700 24px/1.25 var(--display);text-wrap:balance}
h2{margin:0;font:700 17px/1.3 var(--display)}
h3{margin:0;font:700 14.5px/1.3 var(--display)}
.lead{margin:4px 0 0;color:var(--muted);max-width:75ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);padding:7px 12px;border-radius:9px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.ghost{background:none;border-color:transparent;color:var(--pri)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:9px 12px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--pri);border-bottom-color:var(--pri)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);padding:4px 10px;border-radius:99px;cursor:pointer;font-size:12.5px;color:var(--muted)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip b{font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
th{font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--soft);font-weight:700}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--soft)}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;text-align:right}
.ref{font:600 12px/1 var(--mono);color:var(--pri)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--soft);color:var(--muted)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--info-bg);color:var(--pri)}
.tag{font:600 10.5px/1 var(--body);letter-spacing:.05em;text-transform:uppercase;padding:3px 6px;border-radius:5px;background:var(--warn-bg);color:var(--warn)}
.tag.conf{background:var(--ok-bg);color:var(--ok)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.search{flex:1;min-width:160px;max-width:320px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi{display:flex;flex-direction:column;gap:2px;cursor:pointer}
.kpi .v{font:700 26px/1.1 var(--display);font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:12.5px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.list{display:flex;flex-direction:column}
.list .it{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:baseline;font-size:13px}
.list .it:last-child{border-bottom:0}
.list .it .t{color:var(--muted);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.callout{border-radius:12px;padding:10px 14px;background:var(--info-bg);font-size:13px}
.callout.warn{background:var(--warn-bg)}.callout.bad{background:var(--bad-bg);color:var(--bad)}.callout.ok{background:var(--ok-bg);color:var(--ok)}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,12,30,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);z-index:21;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(10,12,30,.18);padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dh{display:flex;gap:10px;align-items:flex-start;padding:14px 18px;background:var(--card);border-bottom:1px solid var(--line)}
.dh .x{margin-left:auto}
.db{overflow:auto;padding:16px 18px 40px;display:flex;flex-direction:column;gap:14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld.w{grid-column:1/-1}
.fld label{font-size:12px;font-weight:600;color:var(--muted)}
.fld label .rq{color:var(--bad)}
.fld input,.fld select,.fld textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.fld textarea{min-height:64px;resize:vertical}
.fld select[multiple]{min-height:84px}
.fld .ro{padding:7px 9px;border:1px dashed var(--line);border-radius:8px;color:var(--ink);background:var(--soft);min-height:35px;overflow-wrap:anywhere}
.fld .help{font-size:11.5px;color:var(--muted)}
.fld .err{font-size:12px;color:var(--bad);font-weight:600}
.fld.bad input,.fld.bad select,.fld.bad textarea{border-color:var(--bad)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec>h3{display:flex;gap:8px;align-items:center}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;font-size:12.5px}
.meta div span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.hist{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:6px}
.hist .h{position:relative;padding:0 0 12px 14px;font-size:12.5px}
.hist .h::before{content:"";position:absolute;left:-6px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--pri)}
.hist .h .t{color:var(--muted);font-size:11.5px}
.hist .ch{font-family:var(--mono);font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.hist .ch b{color:var(--ink);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;flex-direction:column;gap:6px;align-items:center;width:min(560px,calc(100% - 32px))}
.toast div{background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast div.bad{background:var(--bad);color:#fff}
.reqs{display:flex;flex-direction:column;gap:10px}
.req{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card);display:flex;flex-direction:column;gap:4px}
.req .id{font:600 12px/1 var(--mono);color:var(--pri)}
.req .ac{font-size:12.5px;color:var(--muted)}
.req .try{font-size:12.5px;background:var(--soft);padding:6px 9px;border-radius:8px}
ol.flow{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.qs{display:flex;flex-direction:column;gap:6px}
.q{background:var(--warn-bg);color:var(--ink);padding:8px 12px;border-radius:10px;font-size:13px}
.q b{color:var(--warn)}
.bar{display:flex;align-items:center;gap:8px;font-size:12.5px}
.bar .tr{flex:1;height:10px;background:var(--soft);border-radius:5px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--pri);border-radius:5px}
.bar .lb{width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .vv{width:40px;text-align:right;font-variant-numeric:tabular-nums}
.inline{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;padding:10px;border:1px dashed var(--line);border-radius:10px}
.inline .fld{flex:1;min-width:150px}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(300px,86%);z-index:30;transform:translateX(-105%);transition:transform .2s;box-shadow:8px 0 30px rgba(0,0,0,.2);padding-top:calc(12px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .menu{display:inline-block}
  .two{grid-template-columns:1fr}
  .who .lbl{display:none}
}
@media (max-width:560px){.form{grid-template-columns:1fr}.brand small{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head><body>
<div class="app">
  <header class="top">
    <button class="btn sm menu" id="menuBtn" aria-label="Show processes">☰ Processes</button>
    <div class="brand">iReport <small>Wireframe · FRS 0.2</small></div>
    <div class="sp"></div>
    <label class="who" for="userSel"><span class="lbl">Signed in as</span>
      <select id="userSel"></select></label>
  </header>
  <nav class="side" id="side"></nav>
  <main id="main"></main>
</div>
<div id="drawerHost"></div>
<div class="toast" id="toast" aria-live="polite"></div>

t.", "D"], ["FRS-HRA-02", "The system shall allow the Annual Leave processor to update Supporter Group, Supporter Name, Status and Update on a submitted request.", "Processing updates appear on the employee’s submitted request reference.", "D"], ["FRS-HRA-03", "The system shall present an Annual Leave request through submission, processing and closed views using the same request reference.", "Moving a request to a configured closed state makes it appear in Closed Annual Leave without copying it.", "P"], ["FRS-HRA-04", "The system shall reject submission of an Annual Leave request when To is earlier than From.", "To earlier than From produces a date-range error and no submitted request.", "P"]], "qs": ["Q-HRA-01: Is manager approval required, and how are days, balance and holidays calculated?", "Q-HRA-02: What defines Closed, and when may a request be edited or cancelled?"], "src": "direct-support.html / annual_leave ; direct-support.html / admin_annual_leave ; direct-support.html / closed_annual_leave", "actors": "Requester; leave processor; decision authority if required by policy", "trigger": "An employee requests leave"}, {"id": "HRS", "name": "Swap request", "area": "HR and workforce", "outcome": "A swap request identifying parties, date and result", "flow": ["Identify employee and swap counterpart", "Record swap date, new location and description", "Record processing party, response and status"], "reqs": [["FRS-HRS-01", "The system shall retain Employee ID and Swap With as separate parties on a Swap request.", "The request distinguishes its employee from its swap counterpart.", "D"], ["FRS-HRS-02", "The system shall retain Request Date, Swap Date, Location and New location without conflating request and swap dates or current and new locations.", "A request with different dates and locations returns all four distinct values.", "D"], ["FRS-HRS-03", "The system shall allow the Swap processor to record Update, Status and Supporter Name on the swap request.", "The p   o.ents=(o.ents||[o.ent]).map(e=>Object.assign({key:'main',views:[{id:'all',name:'All'}],cols:[],fields:[]},e));
  P[id]=Object.assign({},base,o);
}
const closedHR=['Closed','Rejected'];
const HR_STATUS=['New','In Progress','Approved','Rejected','Closed'];
function hrFields(extra){return [
  F('employee','Employee ID','user',{req:1,help:'The employee the request is for.'}),
  ...extra,
  F('extension','Extension'),
  F('priority','Priority','sel',{o:['Normal','High','Urgent']}),
  F('description','Description','ta',{req:1,w:1,ro:1,help:'Kept as written. Processing notes go in Update.'}),
  F('attach','Attach','file'),
  F('supporter_group','Supporter Group','sel',{s:'proc',o:['HR Operations','WFM','Facilities','IT Support']}),
  F('supporter_name','Supporter Name','user',{s:'proc'}),
  F('status','Status','sel',{s:'proc',o:HR_STATUS,dflt:'New'}),
  F('update','Update','ta',{s:'proc',w:1}),
]}
function hrEnt(name,prefix,extra,cols,more={}){return Object.assign({name,prefix,fields:hrFields(extra),cols:['employee',...cols,'supporter_name','status'],statusKey:'status',
  defaults:u=>({employee:u.id,status:'New'}),
  visible:(r,u)=>isProc(u)||r.employee===u.id||r.created_by===u.id,
  views:[{id:'mine',name:'My requests',f:(r,u)=>r.employee===u.id||r.created_by===u.id},
         {id:'proc',name:'Processing queue',f:r=>!closedHR.includes(r.status),proc:1},
         {id:'closed',name:'Closed',f:r=>closedHR.includes(r.status),note:'Closed = Closed or Rejected. Assumption until Q-HRA-02 is answered.'}],
},more)}

const entOf=(pid,ek)=>P[pid].ents.find(e=>e.key===ek);
const fieldsOf=(e,r)=>e.dyn?e.fields.concat(e.dyn(r||{})):e.fields;
const META={created_by:{k:'created_by',l:'Added By',t:'user'},created_on:{k:'created_on',l:'Added On',t:'dt'},last_edit_by:{k:'last_edit_by',l:'Last Edit By',t:'user'},last_edit_on:{k:'last_edit_on',l:'Last Edit On',t:'dt'},by:{k:'by',l:'By',t:'user'},at:{k:'at',l:'At',t:'dt'},end:{k:'end',l:'End Time',t:'dt'},closed_by:{k:'closed_by',l:'Closed By',t:'user'},closed_dt:{k:'closed_dt',l:'Closed Datetime',t:'dt'}};
function fdef(e,k,fs){return (fs||e.fields).find(f=>f.k===k)||META[k]||{k,l:(e.colLabels||{})[k]||k,t:'text'}}
function optsOf(f,r){let o=typeof f.o==='function'?f.o(r||{}):(f.o||[]);if(f.t==='user')o=peopleOpts();if(f.t==='ref'){const[pid,ek]=f.ref;o=rows(pid,ek).filter(x=>!f.refFilter||f.refFilter(x)||x.id===r?.[f.k]).map(x=>[x.id,f.refLabel(x)])}return o.map(x=>Array.isArray(x)?x:[x,x])}
function fmtVal(f,v,r,u){
  if(f.mask&&u&&f.mask(u,r)&&v)return '•••••••'+String(v).slice(-4);
  if(empty(v))return '—';
  const t=f.fmt||f.t;
  if(t==='user')return pn(v);
  if(t==='ref'){const[pid,ek]=f.ref;const x=rows(pid,ek).find(x=>x.id===v);return x?f.refLabel(x):v}
  if(t==='dt')return String(v).replace('T',' ');
  if(Array.isArray(v))return v.join(', ');
  return String(v)}
function statusPill(e,r){
  if(e.noStatus)return '';const v=r[e.statusKey];if(empty(v))return '';
  if(e.pillFmt){const[l,c]=e.pillFmt(v);return `<span class="pill ${c}">${esc(l)}</span>`}
  const s=String(v).toLowerCase();let c='';
  if(/rejected|fail|cancel|not valid|not reached|critical/.test(s))c='bad';
  else if(/closed|resolved|approved|retained|pass|done|completed|solved|activated|accepted|valid|updated/.test(s))c='ok';
  else if(/pending|escalat|review|follow|callback|revalid|coaching/.test(s))c='warn';
  else if(/new|open|progress|assigned|scheduled|contacted|offer|visited|reached/.test(s))c='info';
  return `<span class="pill ${c}">${esc(v)}</span>`}
function visibleRows(pid,ek,u){const e=entOf(pid,ek);return rows(pid,ek).filter(r=>!e.visible||e.visible(r,u))}
function viewsFor(e,u){return e.views.filter(v=>!v.proc||isProc(u))}
function canCreate(e,u){return e.canCreate?e.canCreate(u):true}

function runAlloc(pid){
  const d=collect($('#allocForm'));S.alloc=d;const n=Number(d.a_n||0);
  if(!d.a_user||n<1){toast(['Pick a user and a number of records of 1 or more.'],1);return}
  let pool=rows(pid,'main');const crit=[];
  if(pid==='ACT'){if(d.a_task&&d.a_task!=='Any'){pool=pool.filter(r=>r.task===d.a_task);crit.push(d.a_task)}if(d.a_status&&d.a_status!=='Any'){pool=pool.filter(r=>r.status===d.a_status);crit.push(d.a_status)}else pool=pool.filter(r=>r.status!=='Completed');
    if(d.a_since){pool=pool.filter(r=>r.created_on.slice(0,10)>=d.a_since);crit.push('since '+d.a_since)}if(d.a_group&&d.a_group!=='Any'){pool=pool.filter(r=>r.user_group===d.a_group);crit.push(d.a_group)}}
  if(pid==='SAL'){if(!d.a_task){toast(['Pick a Task Id.'],1);return}pool=pool.filter(r=>r.task_id===d.a_task);crit.push(d.a_task)}
  if(pid==='RET'){if(!d.a_cst){toast(['Pick a Cst Type.'],1);return}pool=pool.filter(r=>r.cst_type===d.a_cst&&!['Retained','Cancelled'].includes(r.retention_status));crit.push(d.a_cst)}
  pool=d.a_action==='Assign'?pool.filter(r=>!r.assigned_to):pool.filter(r=>r.assigned_to===d.a_user);
  const pick=pool.slice(0,n);const u=me();
  pick.forEach(r=>{const old=r.assigned_to||'';r.assigned_to=d.a_action==='Assign'?d.a_user:'';r.history.push({at:dt(),by:u.id,note:(d.a_action==='Assign'?'Assigned to '+pn(d.a_user):'Released from '+pn(d.a_user))+' by allocation',changes:{assigned_to:[old,r.assigned_to]}});r.last_edit_by=u.id;r.last_edit_on=dt()});
  DB.allocLog.unshift({pid,at:dt(),by:u.id,action:d.a_action,user:d.a_user,n,count:pick.length,crit:crit.join(' · ')||'—'});persist();
  toast([d.a_action+': '+pick.length+' of '+n+' requested'+(pick.length<n?' (only '+pick.length+' qualified)':'')+'.']);render()}

  ${card('Team work','WLG','Work unit, performer, execution period and manager scope; not edit count.',tbl(['Performer','Team','Work logs'],wlg))}
  ${card('Employee requests','HRG / HRA / HRS / HRE / HRT','Type, state, employee, support party and period; request types kept apart.',tbl(['Type',...HR_STATUS],hrT))}
  ${card('Support tickets','SD','Tool, request, assignee, state, Closed Time and elapsed-time definition.',tbl(['Tool','Open','Closed'],sdT))}
  ${card('Delayed complaints','CAS','Eligible states, delay threshold, clock start/stop and current owner.',tbl(['Ref','Account','Worklist','Status','Days open'],del))}
  ${card('Concessions','CTE / CNO','Requested / approved / executed distinction, units and period.',tbl(['Measure (own unit)','Requested','Approved'],conc))}
  ${card('Quality and validation outcomes','QUA / VAL','Call or ticket, review round, reviewer and final decision.',tbl(['Outcome','Count'],qv))}
  ${card('Sales and retention results','SAL / RET','Task, assignee and call result; what counts as success.',tbl(['Task','Target','Leads','Reached','Accepted'],sal)+tbl(['Retention state','Cases'],ret))}
  ${card('Outages','OUT / TOL','Actual vs planned, start/end, impact scope and Ignore treatment.',tbl(['Ref','Type','From','Actual end','Planned end'],out))}
  </div>`}

  const c=DB.cfg;

  <div class="card sec"><div class="form" id="cfgForm">
   ${fieldHTML(F('delayDays','Complaint delay threshold (days) · Q-CAS-02','num'),c,true,{})}
   ${fieldHTML(F('quaQuota','Monthly call-audit quota per LOB and site · Q-QUA-01','num'),c,true,{})}
   ${fieldHTML(F('compLimit','Agent compensation limit (EGP) · Q-CTE-01','num'),c,true,{})}
   ${fieldHTML(F('satLimit','Agent satisfaction limit (EGP) · Q-CTE-01','num'),c,true,{})}
   ${fieldHTML(F('mailFail','Simulate mail failure (FRS-SD-05)','sel',{o:[['0','No'],['1','Yes']]}),{mailFail:c.mailFail?'1':'0'},true,{})}
  </div><div class="row"><button class="btn pri" data-savecfg="1">Save rules</button></div></div>
  <div class="card sec"><h3>Roles in this wireframe</h3><div class="tbl"><table><thead><tr><th>Person</th><th>Role</th><th>Team</th><th>Can do here</th></tr></thead><tbody>
  ${USERS.map(u=>`<tr style="cursor:default"><td>${esc(pn(u[0]))}</td><td>${esc(u[2])}</td><td>${esc(teamOf(u[0]))}</td><td style="white-space:normal">${esc({agent:'Create requests and records; sees own HR requests and work logs; processing fields read only.',leader:'Processing fields; approves referred concessions for own team; sees own team work logs.',manager:'Processing fields; sees own team work logs only.',processor:'HR and SMC processing; complaint feedback in validation.',admin:'Everything, including reopening a closed BSS ticket.'}[u[1]])}</td></tr>`).join('')}

  <div class="card sec"><h3>Sample data</h3><p class="lead">Everything you enter stays in this browser only.</p><div class="row"><button class="btn" id="resetBtn">Reset sample data</button><span id="resetConfirm" hidden><b>Erase your changes?</b> <button class="btn sm pri" data-reset="1">Yes, reset</button> <button class="btn sm" data-reset="0">Keep</button></span></div></div>

/* ---------- fields & forms ---------- */
function fieldHTML(f,r,editable,errs,u){
  const v=r[f.k];const id='f_'+f.k;const req=(f.req===1||(typeof f.req==='function'&&f.req(r)));
  const lab=`<label for="${id}">${esc(f.l)}${req&&editable?' <span class="rq">*</span>':''}</label>`;
  let inp;
  if(!editable||f.t==='auto'){inp=`<div class="ro" id="${id}">${esc(fmtVal(f,f.t==='auto'&&f.calc?f.calc(r,u):v,r,u))}</div>`}
  else if(f.t==='sel'||f.t==='user'||f.t==='ref'){const o=optsOf(f,r);inp=`<select id="${id}" data-k="${f.k}"><option value="">Select…</option>${o.map(([a,b])=>`<option value="${esc(a)}" ${String(v??'')===String(a)?'selected':''}>${esc(b||'(none)')}</option>`).join('')}</select>`}
  else if(f.t==='multi'){const o=optsOf(f,r);const vs=v||[];inp=`<select id="${id}" data-k="${f.k}" multiple>${o.map(([a,b])=>`<option value="${esc(a)}" ${vs.includes(a)?'selected':''}>${esc(b)}</option>`).join('')}</select>`}
  else if(f.t==='ta')inp=`<textarea id="${id}" data-k="${f.k}">${esc(v)}</textarea>`;
  else if(f.t==='list'){inp=`<input id="${id}" data-k="${f.k}" list="${id}_l" value="${esc(v)}" autocomplete="off"><datalist id="${id}_l">${optsOf(f,r).map(([a])=>`<option value="${esc(a)}">`).join('')}</datalist>`}
  else if(f.t==='file')inp=`<input id="${id}" data-k="${f.k}" type="file" data-cur="${esc(v)}">${v?`<span class="help">Attached: ${esc(v)}</span>`:''}`;
  else{const t={num:'number',date:'date',dt:'datetime-local',time:'time'}[f.t]||'text';inp=`<input id="${id}" data-k="${f.k}" type="${t}" value="${esc(v)}">`}
  const err=errs&&errs[f.k];
  return `<div class="fld ${f.w||f.t==='ta'?'w':''} ${err?'bad':''}">${lab}${inp}${err?`<span class="err">${esc(err)}</span>`:''}${f.help&&(editable||f.t==='auto')?`<span class="help">${esc(f.help)}</span>`:''}</div>`}
function collect(root){const o={};root.querySelectorAll('[data-k]').forEach(el=>{const k=el.dataset.k;
  if(el.multiple)o[k]=[...el.selectedOptions].map(x=>x.value);
  else if(el.type==='file')o[k]=el.files&&el.files[0]?el.files[0].name:(el.dataset.cur||'');
  else if(el.type==='number')o[k]=el.value===''?'':Number(el.value);
  else o[k]=el.value});return o}
function canEditField(e,f,r,mode,u,locked){
  if(f.t==='auto')return false;if(locked)return false;if(f.ro&&mode!=='new')return false;
  if(e.editRole&&!e.editRole(u))return false;
  if(f.s==='proc'&&!isProc(u))return false;if(f.who&&!f.who(u,r))return false;return true}

/* ---------- drawer ---------- */
function openRec(pid,ek,id){S.drawer={pid,ek,id,errs:{},draft:null,act:null};renderDrawer()}
function openNew(ek){const e=entOf(S.pid,ek),u=me();const d=Object.assign({},e.defaults?e.defaults(u):{});fieldsOf(e,d).forEach(f=>{if(d[f.k]==null&&f.dflt)d[f.k]=f.dflt});S.drawer={pid:S.pid,ek,id:null,errs:{},draft:d};renderDrawer()}
function closeDrawer(){S.drawer=null;renderDrawer()}
function renderDrawer(){
  const host=$('#drawerHost');if(!S.drawer){host.innerHTML='';return}
  const {pid,ek,id,errs}=S.drawer;const e=entOf(pid,ek),u=me();
  const rec=id?rows(pid,ek).find(r=>r.id===id):null;
  if(id&&(!rec||(e.visible&&!e.visible(rec,u)))){host.innerHTML=`<div class="scrim" data-close="1"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="Record"><div class="dh"><h2>Not available</h2><button class="btn sm x" data-close="1">Close</button></div><div class="db"><div class="callout bad">You do not have access to this record as ${esc(u.name)} (${esc(u.roleName)}).</div></div></aside>`;return}
  const mode=id?'edit':'new';
  const r=S.drawer.draft||clone(rec);
  const locked=mode==='edit'&&e.locked?e.locked(rec,u):null;
  const fs=fieldsOf(e,r).filter(f=>!f.when||f.when(r));
  const visibleFs=fs.filter(f=>!(mode==='new'&&(f.s==='proc'||(f.t==='auto'&&!f.calc))));
  const anyEditable=visibleFs.some(f=>canEditField(e,f,r,mode,u,locked));
  const form=`<div class="form" id="recForm">${visibleFs.map(f=>fieldHTML(f,r,canEditField(e,f,r,mode,u,locked),errs,u)).join('')}</div>`;
  let extra='';
  if(mode==='edit'){
    const acts=(e.actions||[]).filter(a=>a.show(rec,u));
    if(acts.length)extra+=`<div class="sec"><div class="row">${acts.map(a=>`<button class="btn" data-act="${a.id}">${esc(a.label)}</button>`).join('')}</div>${S.drawer.act?`<div class="inline">${fieldHTML(F('act_reason',(e.actions.find(a=>a.id===S.drawer.act)||{}).reason||'Reason','text'),{},true,S.drawer.actErr?{act_reason:S.drawer.actErr}:{})}<button class="btn pri" data-actrun="${S.drawer.act}">Confirm</button><button class="btn" data-actcancel="1">Cancel</button></div>`:''}</div>`;
    (e.children||[]).forEach(c=>{const list=rec[c.key]||[];const cd=(S.drawer.child&&S.drawer.child.key===c.key)?S.drawer.child:null;const canAdd=!locked||c.allowLocked;
      extra+=`<div class="sec card"><h3>${esc(c.name)} <span class="pill">${list.length}</span></h3>
      ${list.length?`<div class="tbl"><table><thead><tr>${c.cols.map(k=>`<th>${esc(fdef(c,k,c.fields).l)}</th>`).join('')}${c.close?'<th></th>':''}</tr></thead><tbody>${list.map(x=>`<tr style="cursor:default">${c.cols.map(k=>{const f=fdef(c,k,c.fields);return k==='status'?`<td>${statusPill({statusKey:'status'},x)}</td>`:`<td style="white-space:normal">${esc(fmtVal(f,x[k],x,u))}</td>`}).join('')}${c.close?`<td>${c.close.show(x)&&canAdd?`<button class="btn sm" data-cclose="${c.key}|${x.id}">${c.close.label}</button>`:''}</td>`:''}</tr>`).join('')}</tbody></table></div>`:'<div class="empty">None yet.</div>'}
      ${canAdd?(cd?`<div class="inline" id="childForm">${c.fields.filter(f=>f.t!=='auto').map(f=>fieldHTML(f,cd.d,true,cd.errs)).join('')}<button class="btn pri" data-csave="${c.key}">Add</button><button class="btn" data-ccancel="1">Cancel</button></div>`:`<div><button class="btn" data-cadd="${c.key}">${esc(c.add)}</button></div>`):''}
      <p class="lead" style="font-size:12px">Entries are added, never overwritten.</p></div>`});
    extra+=`<div class="sec card"><h3>Record</h3><div class="meta">${['created_by','created_on','last_edit_by','last_edit_on'].map(k=>`<div><span>${META[k].l}</span>${esc(fmtVal(META[k],rec[k],rec,u))}</div>`).join('')}</div></div>
     <div class="sec"><h3>History</h3><div class="hist">${rec.history.slice().reverse().map(h=>`<div class="h"><div><b>${esc(pn(h.by))}</b> · ${esc(h.note||'Edited')}</div><div class="t">${esc(h.at.replace('T',' '))}</div>${h.changes?`<div class="ch">${Object.entries(h.changes).map(([k,[a,b]])=>{const f=fdef(e,k,fieldsOf(e,rec));return `${esc(f.l)}: ${esc(fmtVal(f,a,rec,u))} → <b>${esc(fmtVal(f,b,rec,u))}</b>`}).join('<br>')}</div>`:''}</div>`).join('')}</div></div>`}
  const general=errs&&errs._?`<div class="callout bad">${esc(errs._)}</div>`:'';
  host.innerHTML=`<div class="scrim" data-close="1"></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(e.name)}">
   <div class="dh"><div><p class="eyebrow">${esc(P[pid].id)} · ${esc(e.name)}</p><h2>${mode==='new'?'New '+esc(e.name.toLowerCase()):`<span class="ref" style="font-size:16px">${rec.id}</span>`} ${mode==='edit'?statusPill(e,rec):''}</h2></div><button class="btn sm x" data-close="1" aria-label="Close">Close</button></div>
   <div class="db">
    ${e.banner?`<div class="callout warn">${esc(e.banner)}</div>`:''}
    ${locked?`<div class="callout warn">${esc(locked)}</div>`:''}
    ${!isProc(u)&&fs.some(f=>f.s==='proc')&&mode==='edit'?`<div class="callout">Processing fields are read only for your role.</div>`:''}
    ${general}${form}
    ${anyEditable?`<div class="row"><button class="btn pri" data-save="1">${mode==='new'?'Submit':'Save changes'}</button><button class="btn" data-close="1">Cancel</button></div>`:''}
    ${extra}
   </div></aside>`;
  const first=host.querySelector('#recForm [data-k]');if(first&&mode==='new'&&!S.drawer.focused){S.drawer.focused=1;first.focus()}}

function saveRec(){
  const {pid,ek,id}=S.drawer;const e=entOf(pid,ek),u=me();const rec=id?rows(pid,ek).find(r=>r.id===id):null;const mode=id?'edit':'new';
  const old=rec?clone(rec):null;const r=Object.assign({},S.drawer.draft||clone(rec||{}),collect($('#recForm')));
  const locked=mode==='edit'&&e.locked?e.locked(rec,u):null;if(locked){toast([locked],1);return}
  const errs={};const fs=fieldsOf(e,r).filter(f=>!f.when||f.when(r));
  fs.forEach(f=>{if(f.calc)r[f.k]=f.calc(r,u)});
  fs.forEach(f=>{const vis=!(mode==='new'&&f.s==='proc');const req=f.req===1||(typeof f.req==='function'&&f.req(r));if(vis&&req&&canEditField(e,f,r,mode,u,null)&&empty(r[f.k]))errs[f.k]='Required.'});
  if(!Object.keys(errs).length&&e.validate){const v=e.validate(r,old,u);if(typeof v==='string')errs._=v;else if(v)Object.assign(errs,v)}
  if(Object.keys(errs).length){S.drawer.errs=errs;S.drawer.draft=r;renderDrawer();toast(['Check the highlighted fields.'],1);return}
  const notes=[];
  if(e.before)e.before(r,old,u,notes);
  fieldsOf(e,r).forEach(f=>{if(f.calc)r[f.k]=f.calc(r,u)});
  if(mode==='new'){DB.seq[e.prefix]=(DB.seq[e.prefix]||0)+1;r.id=e.prefix+'-'+String(DB.seq[e.prefix]).padStart(4,'0');r.created_by=u.id;r.created_on=dt();r.history=[{at:r.created_on,by:u.id,note:'Created'}];rows(pid,ek).push(r);notes.unshift('Created '+r.id+'.')}
  else{const ch={};const keys=new Set([...Object.keys(r),...Object.keys(old)]);['history','id','created_by','created_on','last_edit_by','last_edit_on',...(e.children||[]).map(c=>c.key)].forEach(k=>keys.delete(k));
    keys.forEach(k=>{const a=old[k],b=r[k];if(JSON.stringify(empty(a)?'':a)!==JSON.stringify(empty(b)?'':b))ch[k]=[a??'',b??'']});
    if(!Object.keys(ch).length){toast(['No changes to save.']);return}
    r.last_edit_by=u.id;r.last_edit_on=dt();r.history=old.history.concat([{at:r.last_edit_on,by:u.id,note:'Edited',changes:ch}]);
    Object.assign(rec,r);notes.unshift('Saved '+r.id+'.')}
  if(e.after)e.after(mode==='new'?r:rec,old,u,notes);
  if(e.saveNote&&mode==='new')notes.push(e.saveNote);
  persist();S.drawer={pid,ek,id:r.id,errs:{},draft:null};toast(notes);render()}

function runAction(aid){const {pid,ek,id}=S.drawer;const e=entOf(pid,ek),u=me();const rec=rows(pid,ek).find(r=>r.id===id);const a=e.actions.find(a=>a.id===aid);
  const reason=($('#f_act_reason')||{}).value||'';if(a.reason&&!reason.trim()){S.drawer.actErr='Give a reason.';renderDrawer();return}
  const old=clone(rec);const notes=[];const note=a.run(rec,u,reason.trim(),notes);const ch={};Object.keys(rec).forEach(k=>{if(!['history'].includes(k)&&JSON.stringify(old[k])!==JSON.stringify(rec[k]))ch[k]=[old[k]??'',rec[k]]});
  rec.history.push({at:dt(),by:u.id,note,changes:Object.keys(ch).length?ch:undefined});rec.last_edit_by=u.id;rec.last_edit_on=dt();persist();S.drawer.act=null;S.drawer.actErr=null;toast(notes.length?notes:[note]);render()}

function childSave(key){const {pid,ek,id}=S.drawer;const e=entOf(pid,ek),u=me();const rec=rows(pid,ek).find(r=>r.id===id);const c=e.children.find(c=>c.key===key);
  const d=Object.assign({},S.drawer.child.d,collect($('#childForm')));const errs={};
  c.fields.forEach(f=>{if(f.req===1&&f.t!=='auto'&&empty(d[f.k]))errs[f.k]='Required.'});
  if(!Object.keys(errs).length&&c.validate){const v=c.validate(d,rec);if(v)Object.assign(errs,v)}
  if(Object.keys(errs).length){S.drawer.child={key,d,errs};renderDrawer();return}
  d.id=(rec[key]||[]).reduce((m,x)=>Math.max(m,x.id),0)+1;d.by=u.id;d.at=d.at||dt();if(c.onAdd)c.onAdd(d);
  rec[key]=(rec[key]||[]).concat([d]);rec.history.push({at:dt(),by:u.id,note:'Added to '+c.name+': '+c.fields.filter(f=>f.t!=='auto').map(f=>fmtVal(f,d[f.k],d,u)).join(' · ')});rec.last_edit_by=u.id;rec.last_edit_on=dt();
  persist();S.drawer.child=null;toast(['Added to '+c.name+'. Earlier entries are unchanged.']);render()}
function childClose(key,cid){const {pid,ek,id}=S.drawer;const e=entOf(pid,ek),u=me();const rec=rows(pid,ek).find(r=>r.id===id);const c=e.children.find(c=>c.key===key);const x=rec[key].find(x=>x.id===Number(cid));
  c.close.run(x,u);rec.history.push({at:dt(),by:u.id,note:c.close.label+' in '+c.name+': '+(x.bras||x.reason||'#'+x.id)});persist();toast([c.name+' entry updated.']);render()}

/* ---------- toast ---------- */
let tt;function toast(msgs,bad){const t=$('#toast');t.innerHTML=msgs.map(m=>`<div class="${bad?'bad':''}">${esc(m)}</div>`).join('');clearTimeout(tt);tt=setTimeout(()=>t.innerHTML='',4800)}

/* ---------- events ---------- */
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-go],[data-open],[data-new],[data-view],[data-tab],[data-ent],[data-close],[data-save],[data-act],[data-actrun],[data-actcancel],[data-cadd],[data-csave],[data-ccancel],[data-cclose],[data-alloc],[data-savecfg],[data-reset],#resetBtn,#menuBtn');
  if(!t)return;const d=t.dataset;
  if(t.id==='menuBtn'){$('#side').classList.toggle('open');return}
  if(t.id==='resetBtn'){$('#resetConfirm').hidden=false;return}
  if(d.go!=null){if(location.hash==='#'+d.go)route();else go(d.go);return}
  if(d.open){const[pid,ek,id]=d.open.split('|');openRec(pid,ek,id);return}
  if(d.new){openNew(d.new);return}
  if(d.view){S.view=d.view;render();return}
  if(d.ent){S.ek=d.ent;S.tab='records';S.view=null;S.q='';render();return}
  if(d.tab){S.tab=d.tab;if(d.tab==='records')S.ek='main';render();return}
  if(d.close){closeDrawer();return}
  if(d.save){saveRec();return}
  if(d.act){S.drawer.act=d.act;S.drawer.actErr=null;renderDrawer();return}
  if(d.actrun){runAction(d.actrun);return}
  if(d.actcancel){S.drawer.act=null;renderDrawer();return}
  if(d.cadd){const c=entOf(S.drawer.pid,S.drawer.ek).children.find(c=>c.key===d.cadd);const rec=rows(S.drawer.pid,S.drawer.ek).find(r=>r.id===S.drawer.id);S.drawer.child={key:d.cadd,d:c.defaults?c.defaults(rec):{},errs:{}};renderDrawer();return}
  if(d.csave){childSave(d.csave);return}
  if(d.ccancel){S.drawer.child=null;renderDrawer();return}
  if(d.cclose){const[k,i]=d.cclose.split('|');childClose(k,i);return}
  if(d.alloc){runAlloc(d.alloc);return}
  if(d.savecfg){const v=collect($('#cfgForm'));['delayDays','quaQuota','compLimit','satLimit'].forEach(k=>{if(v[k]!==''&&v[k]>=0)DB.cfg[k]=Number(v[k])});DB.cfg.mailFail=v.mailFail==='1';persist();toast(['Rules saved.']);render();return}
  if(d.reset!=null){if(d.reset==='1'){const user=DB.user;seed();DB.user=user;persist();toast(['Sample data reset.'])}render();return}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&S.drawer){closeDrawer();return}
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('tr[data-open],[role=button]')){ev.preventDefault();ev.target.click()}});
document.addEventListener('input',ev=>{if(ev.target.id==='q'){S.q=ev.target.value;const pos=ev.target.selectionStart;render();const q=$('#q');if(q){q.focus();q.setSelectionRange(pos,pos)}}});
document.addEventListener('change',ev=>{
  if(ev.target.id==='userSel'){DB.user=ev.target.value;persist();S.drawer=null;S.alloc=null;render();toast(['Signed in as '+me().name+' ('+me().roleName+').']);return}
  const form=ev.target.closest('#recForm');
  if(form&&S.drawer&&ev.target.tagName!=='SELECT'){const e=entOf(S.drawer.pid,S.drawer.ek);S.drawer.draft=Object.assign({},S.drawer.draft||clone(rows(S.drawer.pid,S.drawer.ek).find(r=>r.id===S.drawer.id)||{}),collect(form));
    fieldsOf(e,S.drawer.draft).forEach(f=>{if(f.t==='auto'&&f.calc){const el=document.getElementById('f_'+f.k);if(el)el.textContent=fmtVal(f,f.calc(S.drawer.draft,me()),S.drawer.draft,me())}});return}
  if(form&&S.drawer){S.drawer.draft=Object.assign({},S.drawer.draft||clone(rows(S.drawer.pid,S.drawer.ek).find(r=>r.id===S.drawer.id)||{}),collect(form));
    const e=entOf(S.drawer.pid,S.drawer.ek);const k=ev.target.dataset.k;
    fieldsOf(e,S.drawer.draft).forEach(f=>{if(f.dep===k)S.drawer.draft[f.k]=''});
    const sc=$('.db')?.scrollTop;renderDrawer();const db=$('.db');if(db)db.scrollTop=sc;const el=document.getElementById('f_'+k);if(el)el.focus()}
});
window.addEventListener('hashchange',route);

/* ---------- boot ---------- */
if(!load()||!DB.r||!DB.cfg){seed();persist()}
route();
</script>

</body></html>
