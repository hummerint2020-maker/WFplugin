<style>
/* Layout: the product's own look (indigo hero, white rounded cards, Alexandria), as the approved approvals and org-chart mockups. Phone screens sit in a phone-width column with notes beside them; the desktop screen is a list + detail split. */
:root{
  --bg:#f3f4fa; --card:#ffffff; --ink:#15153a; --sub:#5d6382; --faint:#8b90ab; --line:#e5e7f2; --soft:#f6f7fc;
  --brand:#4836e0; --brand-soft:#eeecff; --hero-a:#16133f; --hero-b:#3a2bc4; --on-brand:#ffffff;
  --ok:#0b7a4b; --ok-bg:#e8f7ef; --warn:#8a4f00; --warn-bg:#fff6e5; --bad:#b4233c; --bad-bg:#fdecef;
  --t-lv:#4836e0; --t-ot:#a3245b; --t-cx:#0b7d74; --t-sw:#d9480f; --t-fr:#1f6fd1;
  --shadow:0 1px 2px rgba(21,21,58,.06),0 6px 18px rgba(21,21,58,.06);
  --font:"Alexandria",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1020; --card:#191a30; --ink:#ececff; --sub:#a6aacb; --faint:#7d82a6; --line:#2a2c48; --soft:#202240;
  --brand:#8d80ff; --brand-soft:#26244d; --hero-a:#120f33; --hero-b:#2e2496; --on-brand:#0f1020;
  --ok:#57d39a; --ok-bg:#12301f; --warn:#f0b54a; --warn-bg:#2d2412; --bad:#ff8a9c; --bad-bg:#3a1520;
  --t-lv:#8d80ff; --t-ot:#f07aa8; --t-cx:#4fd1c5; --t-sw:#ff9a5c; --t-fr:#6aa8ff;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1020; --card:#191a30; --ink:#ececff; --sub:#a6aacb; --faint:#7d82a6; --line:#2a2c48; --soft:#202240;
  --brand:#8d80ff; --brand-soft:#26244d; --hero-a:#120f33; --hero-b:#2e2496; --on-brand:#0f1020;
  --ok:#57d39a; --ok-bg:#12301f; --warn:#f0b54a; --warn-bg:#2d2412; --bad:#ff8a9c; --bad-bg:#3a1520;
  --t-lv:#8d80ff; --t-ot:#f07aa8; --t-cx:#4fd1c5; --t-sw:#ff9a5c; --t-fr:#6aa8ff;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px;margin:0}
button,input,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.wrap{max-width:1180px;margin-inline:auto;display:grid;gap:16px}
.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.head h1{margin:0;font-size:20px}
.head p{margin:2px 0 0;color:var(--sub);font-size:13px;max-width:75ch}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:9px;padding:5px 12px;cursor:pointer;color:var(--sub)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.screens{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.screens::-webkit-scrollbar{display:none}
.screens button{flex:0 0 auto;white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;cursor:pointer;color:var(--sub);font-size:13px}
.screens button[aria-pressed="true"]{border-color:var(--brand);color:var(--brand);background:var(--brand-soft);font-weight:600}

/* phone column + notes */
.stage{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:20px;align-items:start}
.phone{background:var(--bg);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);overflow:hidden;display:grid}
.bar{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.bar b{font-size:16px}
.bar .count{margin-inline-start:auto}
.pbody{padding:12px;display:grid;gap:10px;align-content:start;min-height:560px}
.notes{display:grid;gap:12px}
.note{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px}
.note h3{margin:0 0 6px;font-size:15px}
.note p,.note li{margin:0;color:var(--sub);font-size:13px}
.note ul{margin:0;padding-inline-start:18px;display:grid;gap:4px}

/* bits */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill.brand{background:var(--brand-soft);color:var(--brand)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.mute{background:var(--soft);color:var(--sub)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:40px;padding:0 14px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--on-brand)}
.btn.bad{color:var(--bad)}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--card);border-radius:14px;padding:8px 10px;display:grid;box-shadow:var(--shadow)}
.kpi b{font-size:20px;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi span{font-size:11.5px;color:var(--sub)}
.kpi.warn b{color:var(--warn)}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.filters button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:12.5px;color:var(--sub)}
.filters button[aria-pressed="true"]{border-color:var(--brand);color:var(--brand);background:var(--brand-soft);font-weight:600}
.item{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:12px 14px;display:grid;gap:8px;border-inline-start:4px solid var(--tc)}
.item.sel{outline:2px solid var(--brand)}
.who{display:flex;gap:10px;align-items:center;min-width:0}
.av{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--on-brand);background:var(--tc);flex:0 0 auto}
.who b{display:block;font-size:14px}
.who small{display:block;color:var(--sub);font-size:12px}
.who .chk{margin-inline-start:auto;width:22px;height:22px;accent-color:var(--brand)}
.what{font-size:13.5px}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.acts{display:flex;gap:8px}
.acts .btn{flex:1}
.bulk{position:sticky;bottom:0;display:flex;gap:8px;align-items:center;padding:10px 12px;background:var(--card);border-top:1px solid var(--line)}
.bulk span{color:var(--sub);font-size:13px}
.bulk .btn{margin-inline-start:auto}
.toast{background:var(--ok-bg);color:var(--ok);border-radius:14px;padding:10px 12px;font-weight:600;font-size:13px}

/* path */
.flow{display:grid}
.fstep{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;position:relative;padding-bottom:14px}
.fstep::before{content:"";position:absolute;inset-inline-start:13px;top:28px;bottom:0;border-inline-start:2px solid var(--line)}
.fstep:last-child::before{display:none}
.fstep .b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--soft);border:2px solid var(--line);color:var(--sub)}
.fstep.done .b{background:var(--ok);border-color:var(--ok);color:var(--on-brand)}
.fstep.now .b{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.fstep.skip .b{border-style:dashed}
.fstep.no .b{background:var(--bad);border-color:var(--bad);color:var(--on-brand)}
.fstep b{display:block;font-weight:600;font-size:13.5px}
.fstep small{display:block;color:var(--sub);font-size:12px}
.fstep.skip b{color:var(--faint);font-weight:500}
.sheet{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px;display:grid;gap:12px}
.sheet h3{margin:0;font-size:15px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px}
.facts dt{color:var(--sub)}
.facts dd{margin:0;font-variant-numeric:tabular-nums}
textarea{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;width:100%;min-height:64px;resize:vertical}
.err{color:var(--bad);font-size:12.5px}

/* desktop */
.desk{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.dlist{border-inline-end:1px solid var(--line);display:grid;align-content:start}
.drow{display:grid;grid-template-columns:24px 36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer;background:none;border-inline:0;border-bottom:0;text-align:start;width:100%}
.drow[aria-current="true"]{background:var(--brand-soft)}
.drow .what{font-size:12.5px;color:var(--sub)}
.dtop{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 14px}
.ddetail{padding:16px 18px;display:grid;gap:12px;align-content:start}
.dec{display:grid;gap:10px}
.dec .row{display:flex;gap:8px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:14px}
.dec .row b{min-width:24px;color:var(--brand)}
.dec .row p{margin:0}
.dec .row small{display:block;color:var(--sub)}
@media (max-width:860px){.stage{grid-template-columns:minmax(0,1fr)}.desk{grid-template-columns:minmax(0,1fr)}.dlist{border-inline-end:0}}
@media (prefers-reduced-motion:no-preference){.item,.drow{transition:outline-color .15s,background .15s}}
</style>

</div>

 {id:6,k:'lv',c:'--t-fr',n:{ar:'م. خالد رضا',en:'Eng. Khaled Reda'},s:{ar:'المدير العام',en:'General Manager'},w:{ar:'إجازة سنوية · يومين · ٢٧–٢٨ أكتوبر',en:'Annual leave · 2 days · 27–28 Oct'},lv:[1,1],h:3,admins:true}

var lang='ar',screen='s1',filter='all',selecting=false,sel={},done={},sheetState='',mineState='',cur=2;
function t(k,v){var s=(T[k]||{})[lang]||k;if(v)for(var x in v)s=s.split('{'+x+'}').join(v[x]);return s;}
function num(n){return lang==='ar'?String(n).replace(/\d/g,function(d){return '٠١٢٣٤٥٦٧٨٩'[d];}):String(n);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function ini(n){return n.split(' ').filter(Boolean).slice(-2).map(function(w){return w[0];}).join('');}
function list(){return ITEMS.filter(function(it){return !done[it.id]&&(filter==='all'||(filter==='late'?it.late:it.k===filter));}).sort(function(a,b){return (b.late?1:0)-(a.late?1:0);});}
function meta(it){return '<div class="meta"><span class="pill mute">'+t('lvl',{a:num(it.lv[0]),b:num(it.lv[1])})+'</span><span class="pill '+(it.late?'bad':'mute')+'">'+(it.late?t('overdue')+' · ':'')+t('wait',{h:num(it.h)})+'</span>'+(it.moved?'<span class="pill warn">'+t('moved',{n:it.moved[lang]})+'</span>':'')+(it.admins?'<span class="pill brand">'+t('admins')+'</span>':'')+'</div>';}
function card(it){var on=!!sel[it.id];return '<article class="item'+(on?' sel':'')+'" style="--tc:var('+it.c+')"><div class="who"><span class="av">'+esc(ini(it.n[lang]))+'</span><div><b>'+esc(it.n[lang])+'</b><small>'+esc(it.s[lang])+'</small></div>'+(selecting?'<input type="checkbox" class="chk" id="chk'+it.id+'" data-sel="'+it.id+'"'+(on?' checked':'')+' aria-label="'+esc(it.n[lang])+'">':'')+'</div><div class="what">'+esc(it.w[lang])+'</div>'+meta(it)+(selecting?'':'<div class="acts"><button type="button" class="btn ok sm" data-ok="'+it.id+'">'+t('approve')+'</button><button type="button" class="btn sm" data-open="'+it.id+'">'+t('details')+'</button></div>')+'</article>';}
function kpis(){var w=ITEMS.filter(function(i){return !done[i.id];}),l=w.filter(function(i){return i.late;}).length;return '<div class="kpis"><div class="kpi"><b>'+num(w.length)+'</b><span>'+t('waiting')+'</span></div><div class="kpi'+(l?' warn':'')+'"><b>'+num(l)+'</b><span>'+t('late')+'</span></div><div class="kpi"><b>'+num(12+Object.keys(done).length)+'</b><span>'+t('week')+'</span></div></div>';}
function filters(){return '<div class="filters" role="group">'+['all','lv','ot','cx','sw','late'].map(function(f){return '<button type="button" data-filter="'+f+'" aria-pressed="'+(filter===f)+'">'+t('f_'+f)+'</button>';}).join('')+'</div>';}
function s1(){var L=list(),n=Object.keys(sel).length,msg=sheetState&&sheetState.indexOf('bulk:')===0?'<div class="toast" role="status">'+t('done_n',{n:num(sheetState.slice(5))})+'</div>':'';
 return '<div class="stage"><div class="phone"><div class="bar"><b>'+t('inbox')+'</b><button type="button" class="btn sm count" data-selecting>'+(selecting?t('cancel_sel'):t('select'))+'</button></div><div class="pbody">'+msg+kpis()+filters()+(L.length?L.map(card).join(''):'<p class="note">'+t('empty')+'</p>')+'</div>'+(selecting?'<div class="bulk"><span>'+t('selected',{n:num(n)})+'</span><button type="button" class="btn ok" data-bulk'+(n?'':' disabled')+'>'+t('approve_n',{n:num(n)})+'</button></div>':'')+'</div>'
 +'<div class="notes"><div class="note"><h3>'+t('n1')+'</h3><ul><li>'+t('n1a')+'</li><li>'+t('n1b')+'</li><li>'+t('n1c')+'</li><li>'+t('n1d')+'</li></ul></div><div class="note"><h3>'+t('n2')+'</h3><p>'+t('n2a')+'</p></div></div></div>';}
function step(cls,b,title,sub){return '<div class="fstep '+cls+'"><span class="b">'+b+'</span><div><b>'+esc(title)+'</b><small>'+esc(sub)+'</small></div></div>';}
function detail(){var st=sheetState;
 var top=st==='ok'?'<div class="toast" role="status">'+t('ok_next')+'</div>':st==='rej'?'<div class="toast" role="status" style="background:var(--bad-bg);color:var(--bad)">'+t('rej_done')+'</div>':'';
 return top+'<div class="sheet"><h3>'+t('s_title')+'</h3><dl class="facts"><dt>'+t('f_days')+'</dt><dd>'+t('v_days')+'</dd><dt>'+t('f_dates')+'</dt><dd>'+t('v_dates')+'</dd><dt>'+t('f_bal')+'</dt><dd>'+t('v_bal')+'</dd><dt>'+t('f_team')+'</dt><dd>'+t('v_team')+'</dd><dt>'+t('f_reason')+'</dt><dd>'+t('v_reason')+'</dd></dl>'
 +'<h3>'+t('path')+'</h3><div class="flow">'+step(st==='ok'?'done':'now',st==='ok'?'✓':num(1),t('p1'),st==='ok'?(lang==='ar'?'وافقت دلوقتي':'You approved just now'):t('p1s'))+step(st==='ok'?'now':'',num(2),t('p2'),st==='ok'?(lang==='ar'?'دورها دلوقتي':'Her turn now'):t('p2s'))+step('skip',num(3),t('p3'),t('p3s'))+'</div>'
 +(st&&st!=='need'?'':'<label for="note" class="what">'+t('note')+'</label><textarea id="note" placeholder="'+esc(t('note_ph'))+'"></textarea>'+(st==='need'?'<p class="err" role="alert">'+t('need_note')+'</p>':'')+'<div class="acts"><button type="button" class="btn ok" data-decide="ok">'+t('approve')+'</button><button type="button" class="btn bad" data-decide="rej">'+t('reject')+'</button></div>')+'</div>';}
function s2(){return '<div class="stage"><div class="phone"><div class="bar"><b>'+t('details')+'</b></div><div class="pbody">'+detail()+'</div></div><div class="notes"><div class="note"><h3>'+t('n3')+'</h3><ul><li>'+t('n3a')+'</li><li>'+t('n3b')+'</li></ul></div></div></div>';}
function s3(){var c=mineState;
 var r1=c==='done'?'':'<article class="item" style="--tc:var(--t-lv)"><div class="who"><div><b>'+t('r1')+'</b><small>'+t('t_sent')+'</small></div><span class="pill warn" style="margin-inline-start:auto">'+t('r1s')+'</span></div><div class="flow">'
 +step('done','✓',lang==='ar'?'اتبعت':'Sent',t('t_sent'))+step('now',num(1),t('t1'),t('t1s'))+step('',num(2),t('t2'),t('t2s'))+step('skip','–',t('t3'),t('t3s'))+'</div>'
 +(c==='ask'?'<p class="what">'+t('cancel_ok')+'</p><div class="acts"><button type="button" class="btn bad" data-mine="done">'+t('yes')+'</button><button type="button" class="btn" data-mine="">'+t('no')+'</button></div>':'<div class="acts"><button type="button" class="btn bad sm" data-mine="ask">'+t('cancel_req')+'</button></div>')+'</article>';
 return '<div class="stage"><div class="phone"><div class="bar"><b>'+t('mine')+'</b></div><div class="pbody">'+(c==='done'?'<div class="toast" role="status">'+t('cancelled')+'</div>':'')+r1
 +'<article class="item" style="--tc:var(--t-ot)"><div class="who"><div><b>'+t('r2')+'</b><small>'+(lang==='ar'?'منى عادل وافقت · الأربعاء ٩:٠٢':'Mona Adel approved · Wed 09:02')+'</small></div><span class="pill ok" style="margin-inline-start:auto">'+t('r2s')+'</span></div></article>'
 +'<article class="item" style="--tc:var(--t-cx)"><div class="who"><div><b>'+t('r3')+'</b><small>'+t('c_note')+'</small></div><span class="pill bad" style="margin-inline-start:auto">'+t('r3s')+'</span></div></article>'
 +'</div></div><div class="notes"><div class="note"><h3>'+t('n4')+'</h3><ul><li>'+t('n4a')+'</li><li>'+t('n4b')+'</li></ul></div></div></div>';}
function s4(){var L=ITEMS.filter(function(i){return !done[i.id];});
 return '<p class="what" style="color:var(--sub);margin:0">'+t('d_hint')+'</p><div class="desk"><div class="dlist"><div class="dtop"><b>'+t('inbox')+'</b>'+filters()+'</div>'
 +L.map(function(it){return '<button type="button" class="drow" data-cur="'+it.id+'" aria-current="'+(cur===it.id)+'" style="--tc:var('+it.c+')"><input type="checkbox" tabindex="-1" aria-hidden="true"><span class="av">'+esc(ini(it.n[lang]))+'</span><span><b>'+esc(it.n[lang])+'</b><span class="what" style="display:block">'+esc(it.w[lang])+'</span></span><span class="pill '+(it.late?'bad':'mute')+'">'+num(it.h)+(lang==='ar'?' س':' h')+'</span></button>';}).join('')
 +'</div><div class="ddetail">'+detail()+'</div></div>';}
function s5(){return '<div class="note" style="padding:18px"><h3>'+t('dq')+'</h3><div class="dec">'+[1,2,3,4,5,6].map(function(i){return '<div class="row"><b>'+num(i)+'</b><p>'+t('q'+i)+'<small>'+t('q'+i+'a')+'</small></p></div>';}).join('')+'</div></div>';}
function render(){
 document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
 document.getElementById('h-title').textContent=t('title');document.getElementById('h-lead').textContent=t('lead');
 document.querySelectorAll('[data-lang]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.lang===lang));});
 document.getElementById('screens').innerHTML=['s1','s2','s3','s4','s5'].map(function(s){return '<button type="button" data-screen="'+s+'" aria-pressed="'+(screen===s)+'">'+t(s)+'</button>';}).join('');
 document.getElementById('screen').innerHTML={s1:s1,s2:s2,s3:s3,s4:s4,s5:s5}[screen]();
}
document.addEventListener('click',function(e){var b=e.target.closest('button,input');if(!b)return;var d=b.dataset;
 if(d.lang){lang=d.lang;}
 else if(d.screen){screen=d.screen;sheetState='';mineState='';}
 else if(d.filter){filter=d.filter;}
 else if(b.hasAttribute('data-selecting')){selecting=!selecting;sel={};sheetState='';}
 else if(d.sel){if(sel[d.sel])delete sel[d.sel];else sel[d.sel]=1;}
 else if(b.hasAttribute('data-bulk')){var n=Object.keys(sel).length;Object.keys(sel).forEach(function(id){done[id]=1;});sel={};selecting=false;sheetState='bulk:'+n;}
 else if(d.ok){done[d.ok]=1;sheetState='';}
 else if(d.open){screen='s2';sheetState='';}
 else if(d.cur){cur=+d.cur;sheetState='';}
 else if(d.decide){var note=(document.getElementById('note')||{}).value||'';sheetState=d.decide==='rej'&&!note.trim()?'need':d.decide;}
 else if(d.mine!==undefined&&b.hasAttribute('data-mine')){mineState=d.mine;}
 else return;
 render();
});
render();
</script>
