<style>
/* Layout: the product's own look (indigo hero, white rounded cards, Alexandria), as the approved org-chart mockup. One request engine: types → levels → the approver's inbox → the employee's timeline. */
:root{
  --bg:#f3f4fa; --card:#ffffff; --ink:#15153a; --sub:#5d6382; --faint:#8b90ab; --line:#e5e7f2; --soft:#f6f7fc;
  --brand:#4836e0; --brand-soft:#eeecff; --hero-a:#16133f; --hero-b:#3a2bc4;
  --ok:#0b7a4b; --ok-bg:#e8f7ef; --warn:#8a4f00; --warn-bg:#fff6e5; --warn-line:#f6d79b; --bad:#b4233c; --bad-bg:#fdecef;
  --t-adv:#0b7d74; --t-exp:#d9480f; --t-let:#1f6fd1; --t-lv:#4836e0; --t-ot:#a3245b; --t-misc:#7a7f99;
  --shadow:0 1px 2px rgba(21,21,58,.06),0 6px 18px rgba(21,21,58,.06);
  --font:"Alexandria",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1020; --card:#191a30; --ink:#ececff; --sub:#a6aacb; --faint:#7d82a6; --line:#2a2c48; --soft:#202240;
  --brand:#8d80ff; --brand-soft:#26244d; --hero-a:#120f33; --hero-b:#2e2496;
  --ok:#57d39a; --ok-bg:#12301f; --warn:#f0b54a; --warn-bg:#2d2412; --warn-line:#5a4520; --bad:#ff8a9c; --bad-bg:#3a1520;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1020; --card:#191a30; --ink:#ececff; --sub:#a6aacb; --faint:#7d82a6; --line:#2a2c48; --soft:#202240;
  --brand:#8d80ff; --brand-soft:#26244d; --hero-a:#120f33; --hero-b:#2e2496;
  --ok:#57d39a; --ok-bg:#12301f; --warn:#f0b54a; --warn-bg:#2d2412; --warn-line:#5a4520; --bad:#ff8a9c; --bad-bg:#3a1520;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px;margin:0}
button,input,select{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3,h4{text-wrap:balance}
.wrap{max-width:1180px;margin-inline:auto;display:grid;gap:16px}
.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.head h1{margin:0;font-size:20px}
.head p{margin:2px 0 0;color:var(--sub);font-size:13px;max-width:75ch}
.lang{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.lang button{border:0;background:none;border-radius:9px;padding:5px 12px;cursor:pointer;color:var(--sub)}
.lang button[aria-pressed="true"]{background:var(--brand);color:#fff}
.screens{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.screens::-webkit-scrollbar{display:none}
.screens button{flex:0 0 auto;white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;cursor:pointer;color:var(--sub);font-size:13px}
.screens button[aria-pressed="true"]{border-color:var(--brand);color:var(--brand);background:var(--brand-soft);font-weight:600}
.hero{border-radius:22px;padding:22px 24px;color:#fff;background:radial-gradient(120% 140% at 100% 0%,var(--hero-b) 0%,var(--hero-a) 60%);display:grid;gap:14px;box-shadow:var(--shadow)}
.hero .crumb{font-size:12px;opacity:.75}
.hero h2{margin:2px 0 0;font-size:24px;font-weight:600}
.hero p{margin:4px 0 0;opacity:.8;max-width:70ch;font-size:13.5px}
.kpis{display:flex;flex-wrap:wrap;gap:8px}
.kpi{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:8px 14px;display:grid;min-width:110px}
.kpi b{font-size:20px;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi span{font-size:11.5px;opacity:.8}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.card>h3{margin:0;padding:16px 18px 4px;font-size:16px}
.card>.intro{margin:0;padding:0 18px 12px;color:var(--sub);font-size:13px}
.label{font-size:11.5px;font-weight:600;color:var(--faint);letter-spacing:.04em;text-transform:uppercase}
[dir="rtl"] .label{letter-spacing:0;text-transform:none}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill.new{background:var(--brand-soft);color:var(--brand)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.mute{background:var(--soft);color:var(--sub)}
.dot{width:10px;height:10px;border-radius:3px;flex:0 0 auto;background:var(--tc)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:38px;padding:0 14px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{background:none}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.inp{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 12px;min-width:0;width:100%}
.hint{color:var(--sub);font-size:12px;margin:4px 0 0}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}

/* Screen 1: request types */
.types{display:grid}
.trow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1.6fr) auto auto;gap:14px;align-items:center;padding:12px 18px;border-top:1px solid var(--line)}
.trow .name{display:flex;gap:10px;align-items:center;min-width:0}
.trow .name b{display:block;font-weight:600}
.trow .name small{display:block;color:var(--sub);font-size:12px}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:12px}
.chain .lv{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:2px 8px;white-space:nowrap}
.chain .ar{color:var(--faint)}
.switch{width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;flex:0 0 auto;border:0;cursor:pointer}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:inset-inline-start .15s}
.switch[aria-checked="true"]{background:var(--brand)}
.switch[aria-checked="true"]::after{inset-inline-start:19px}
.group-h{padding:12px 18px 6px;font-size:12px;font-weight:600;color:var(--sub);background:var(--soft);border-top:1px solid var(--line)}

/* Screen 2: editor */
.levels{display:grid;gap:10px;padding:0 18px 16px}
.level{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;align-items:start;border:1px solid var(--line);border-radius:16px;padding:12px}
.level .n{width:36px;height:36px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700}
.level .f{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.fld{display:grid;gap:4px}
.fld>span{font-size:12px;font-weight:600;color:var(--sub)}
.add{border:1px dashed var(--line);border-radius:16px;padding:10px;text-align:center;color:var(--brand);background:none;cursor:pointer;font-weight:600}
.add[disabled]{color:var(--faint);cursor:not-allowed}
.opt{display:grid;grid-template-columns:200px minmax(0,1fr);gap:14px;padding:14px 18px;border-top:1px solid var(--line)}
.opt>.k{font-weight:600}
.opt>.k small{display:block;font-weight:400;color:var(--sub);font-size:12px;margin-top:2px}
.inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.inline .inp{width:90px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12.5px;background:var(--card)}
.chip.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}
.preview{padding:16px 18px;display:grid;gap:10px}
.flow{display:grid;gap:0}
.fstep{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;position:relative;padding-bottom:14px}
.fstep::before{content:"";position:absolute;inset-inline-start:13px;top:28px;bottom:0;border-inline-start:2px solid var(--line)}
.fstep:last-child::before{display:none}
.fstep .b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--soft);border:2px solid var(--line);color:var(--sub)}
.fstep.done .b{background:var(--ok);border-color:var(--ok);color:#fff}
.fstep.now .b{background:var(--brand);border-color:var(--brand);color:#fff}
.fstep.cond .b{border-style:dashed}
.fstep b{display:block;font-weight:600;font-size:13.5px}
.fstep small{display:block;color:var(--sub);font-size:12px}

/* Screen 3: inbox */
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:12.5px;color:var(--sub)}
.filters button[aria-pressed="true"]{border-color:var(--brand);color:var(--brand);background:var(--brand-soft);font-weight:600}
.items{display:grid;gap:10px}
.item{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px;display:grid;gap:10px;border-inline-start:4px solid var(--tc)}
.item .top{display:flex;gap:10px;align-items:flex-start}
.av{flex:0 0 auto;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;color:#fff;background:var(--ac,#4836e0)}
.item .who{flex:1;min-width:0}
.item .who b{display:block}
.item .who small{color:var(--sub);font-size:12px}
.amt{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.item .acts{display:flex;gap:8px;flex-wrap:wrap}
.item .acts .btn{flex:1 1 120px}
.prog{display:flex;gap:4px;align-items:center}
.prog i{flex:1;height:5px;border-radius:999px;background:var(--line)}
.prog i.d{background:var(--ok)}
.prog i.c{background:var(--brand)}
.bulk{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--brand-soft);color:var(--brand);border-radius:14px;padding:8px 12px;font-size:13px}
.done-msg{background:var(--ok-bg);color:var(--ok);border-radius:14px;padding:10px 12px;font-size:13px}

/* phone frame */
.phonewrap{display:flex;flex-wrap:wrap;justify-content:center;gap:22px;align-items:flex-start}
.phone{width:min(380px,100%);border:10px solid #101124;border-radius:40px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.ph-head{background:radial-gradient(120% 140% at 100% 0%,var(--hero-b),var(--hero-a) 65%);color:#fff;padding:18px 16px 16px}
.ph-head small{opacity:.75;font-size:11px}
.ph-head h5{margin:2px 0 0;font-size:19px;font-weight:600}
.ph-body{padding:12px;display:grid;gap:12px;min-height:560px;align-content:start}
.caption{max-width:300px;color:var(--sub);font-size:13px;display:grid;gap:8px;align-self:center}
.caption b{color:var(--ink)}

/* Screen 4: employee */
.kind{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kind button{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px 6px;display:grid;justify-items:center;gap:6px;cursor:pointer;font-size:12.5px;color:var(--ink)}
.kind button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}
.kind .ic{width:30px;height:30px;border-radius:10px;background:var(--tc);opacity:.9}
.form{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px;display:grid;gap:10px}
.calc{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:12.5px;display:grid;gap:2px}
.calc b{font-variant-numeric:tabular-nums}
.req{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px;display:grid;gap:10px}
.req .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}

/* Screen 5: substitutes */
.subs{display:grid}
.srow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 18px;border-top:1px solid var(--line)}
.srow small{display:block;color:var(--sub);font-size:12px}

.decide{display:grid;gap:10px;padding:0 18px 16px}
.q{border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;gap:8px}
.q b{font-weight:600}
.q .choices{display:flex;flex-wrap:wrap;gap:6px}
.q .choices span{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12.5px}
.q .choices span.rec{border-color:var(--brand);color:var(--brand);background:var(--brand-soft);font-weight:600}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.why div{background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.why b{display:block;margin-bottom:2px}
.why p{margin:0;color:var(--sub);font-size:13px}
.note{border-radius:14px;padding:10px 12px;font-size:13px;background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line)}

@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}.trow{grid-template-columns:minmax(0,1fr) auto;}.trow .chain{grid-column:1/-1;order:3}.trow .cnt{display:none}.opt{grid-template-columns:minmax(0,1fr);gap:8px}.srow{grid-template-columns:minmax(0,1fr) auto}.srow .x{display:none}}
@media (max-width:520px){.hero{padding:18px}.hero h2{font-size:21px}.kpi{min-width:0;flex:1 1 calc(50% - 8px)}.caption{max-width:none}}
@media (prefers-reduced-motion:reduce){.switch::after{transition:none}}
</style>

  return '<div class="phonewrap"><div class="phone"><div class="ph-head"><small>Workforce One</small><h5>'+t('m_title')+' · '+num(list.length)+'</h5></div><div class="ph-body">'
   +'<div class="filters">'+fb('all','m_all')+fb('mine','m_mine')+fb('sub','m_sub')+fb('late','m_late')+'</div>'
   +(filter==='all'?'<div class="bulk"><span>'+t('m_bulk')+'</span><button type="button" class="btn sm primary">'+t('m_bulk_b')+'</button></div>':'')
   +'<div class="items">'+list.map(function(it){return item(it,ITEMS.indexOf(it));}).join('')+'</div></div></div>'
   +'<div class="caption"><div><b>'+t('m_cap1')+'</b><br>'+t('m_cap1p')+'</div><div><b>'+t('m_cap2')+'</b><br>'+t('m_cap2p')+'</div><div><b>'+t('m_cap3')+'</b><br>'+t('m_cap3p')+'</div></div></div>';
}

  else if(kind==='exp')form='<label class="fld"><span>'+t('f_amount')+'</span><input class="inp" value="'+num('1,250')+'"></label><label class="fld"><span>'+t('f_reason')+'</span><input class="inp" value="'+(lang==='ar'?'مواصلات لعميل في المعادي':'Transport to a client in Maadi')+'"></label><label class="fld"><span>'+t('f_file')+'</span><input class="inp" value="receipt.jpg" readonly></label><div><div class="label">'+t('p_path')+'</div>'+chain(['lv1','lvFin'])+'</div>';
  else form='<label class="fld"><span>'+t('p_letter')+'</span><select class="inp"><option>'+(lang==='ar'?'شهادة مرتب':'Salary certificate')+'</option><option>'+(lang==='ar'?'لمن يهمه الأمر':'To whom it may concern')+'</option><option>'+(lang==='ar'?'شهادة خبرة':'Experience certificate')+'</option></select></label><label class="fld"><span>'+t('p_to')+'</span><input class="inp" value="'+(lang==='ar'?'البنك الأهلي المصري':'National Bank of Egypt')+'"></label><label class="fld"><span>'+t('p_lang')+'</span><select class="inp"><option>عربي</option><option>English</option></select></label><div><div class="label">'+t('p_path')+'</div>'+chain(['lvHR'])+'</div>';
  var tl=function(cls,b,title,sub){return '<div class="fstep '+cls+'"><span class="b">'+b+'</span><div><b>'+esc(title)+'</b><small>'+esc(sub)+'</small></div></div>';};
  return '<div class="phonewrap"><div class="phone"><div class="ph-head"><small>Workforce One</small><h5>'+t('p_new')+'</h5></div><div class="ph-body">'
   +'<div class="kind">'+kb('adv','t_adv')+kb('exp','t_exp')+kb('let','t_let')+'</div><div class="form">'+form+'<button type="button" class="btn primary">'+t('p_send')+'</button></div></div></div>'
   +'<div class="phone"><div class="ph-head"><small>Workforce One</small><h5>'+t('p_mine')+'</h5></div><div class="ph-body">'
   +'<div class="req"><div class="top"><div><b>'+t('t_adv')+' · '+money(8000)+'</b><div class="hint">'+(lang==='ar'?'اتبعت الأحد ٩:٠٢':'Sent Sun 9:02')+'</div></div><span class="pill warn">'+t('st_wait')+'</span></div><div class="flow">'
   +tl('done','✓',t('lv1')+' · '+(lang==='ar'?'كريم فتحي':'Karim Fathy'),(lang==='ar'?'وافق · الأحد ١٠:١٥':'approved · Sun 10:15'))
   +tl('now',num(2),t('lvHR')+' · '+(lang==='ar'?'سارة نبيل':'Sara Nabil'),t('tl_wait'))
   +'</div></div>'
   +'<div class="req"><div class="top"><div><b>'+t('t_let')+'</b><div class="hint">'+(lang==='ar'?'شهادة مرتب · ٢ أكتوبر':'Salary certificate · 2 Oct')+'</div></div><span class="pill ok">'+t('st_ok')+'</span></div></div>'
   +'<div class="req"><div class="top"><div><b>'+t('t_exp')+' · '+money(430)+'</b><div class="hint">'+(lang==='ar'?'"الإيصال مش واضح، ابعته تاني" · أحمد سمير':'"The receipt is not readable, send it again" · Ahmed Samir')+'</div></div><span class="pill bad">'+t('st_rej')+'</span></div></div>'
   +'</div></div><div class="caption"><div><b>'+t('p_cap1')+'</b><br>'+t('p_cap1p')+'</div><div><b>'+t('p_cap2')+'</b><br>'+t('p_cap2p')+'</div></div></div>';
}

/* ---------- 5. substitutes ---------- */
function s5(){
  var r=function(a,b,fr,to,by,now){return '<div class="srow"><div><b>'+esc(a)+'</b><small>'+t('b_who')+'</small></div><div><b>'+esc(b)+'</b><small>'+t('b_sub')+'</small></div><div class="x"><span>'+esc(fr)+' – '+esc(to)+'</span><small>'+t('b_set')+': '+esc(t(by))+'</small></div><span class="pill '+(now?'ok':'mute')+'">'+t(now?'b_now':'b_soon')+'</span></div>';};
  var A=lang==='ar';
  return '<section class="hero"><div><div class="crumb">'+t('crumb5')+'</div><h2>'+t('b_h')+'</h2><p>'+t('b_hp')+'</p></div></section>'
   +'<div class="grid2"><div class="card subs"><h3>'+t('b_h')+'</h3><p class="intro"><button type="button" class="btn sm primary">'+t('b_new')+'</button></p>'
   +r(A?'منى عادل':'Mona Adel',A?'نور سعيد':'Nour Saeed',A?'١٢ أكتوبر':'12 Oct',A?'١٩ أكتوبر':'19 Oct','b_auto',true)
   +r(A?'كريم فتحي':'Karim Fathy',A?'حسن حمدي':'Hassan Hamdy',A?'١٤ أكتوبر':'14 Oct',A?'١٤ أكتوبر':'14 Oct','b_me',true)
   +r(A?'سارة نبيل':'Sara Nabil',A?'محمود سمير':'Mahmoud Samir',A?'١ نوفمبر':'1 Nov',A?'٥ نوفمبر':'5 Nov','b_hr',false)
   +'</div><div style="display:grid;gap:16px"><div class="phone" style="margin-inline:auto"><div class="ph-head"><small>Workforce One</small><h5>'+t('b_app')+'</h5></div><div class="ph-body" style="min-height:0">'
   +'<p class="hint" style="margin:0">'+t('b_app_p')+'</p><div class="form"><label class="fld"><span>'+t('b_sub')+'</span><input class="inp" value="'+(A?'نور سعيد — قائدة فريق':'Nour Saeed — Team Lead')+'"></label><div class="inline"><label class="fld" style="flex:1"><span>'+t('b_from')+'</span><input class="inp" value="'+(A?'١٢/١٠':'12/10')+'"></label><label class="fld" style="flex:1"><span>'+t('b_to')+'</span><input class="inp" value="'+(A?'١٩/١٠':'19/10')+'"></label></div><button type="button" class="btn primary">'+t('e_save')+'</button></div></div></div>'
   +'<div class="card"><h3>'+t('b_rules')+'</h3><ul style="margin:0;padding:6px 18px 16px 34px;display:grid;gap:6px;color:var(--sub)"><li>'+t('b_r1')+'</li><li>'+t('b_r2')+'</li><li>'+t('b_r3')+'</li></ul></div></div></div>';

/* ---------- 6. decisions ---------- */
function s6(){
  var q=function(k,opts,r){return '<div class="q"><b>'+t(k)+'</b><div class="choices">'+opts.map(function(o,i){return '<span'+(i===r?' class="rec" title="'+t('rec')+'"':'')+'>'+(i===r?'★ ':'')+t(o)+'</span>';}).join('')+'</div></div>';};
  return '<div class="card"><h3>'+t('dq')+'</h3><p class="intro">★ = '+t('rec')+'</p><div class="decide">'
   +q('q1',['q1a','q1b','q1c'],0)+q('q2',['q2a','q2b','q2c'],0)+q('q3',['q3a','q3b'],0)+q('q4',['q4a','q4b'],1)+q('q5',['q5a','q5b'],0)
   +'</div></div>';
}

function render(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-t]').forEach(function(el){el.textContent=t(el.dataset.t);});
  document.querySelectorAll('[data-lang]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.lang===lang);});
  document.getElementById('screens').innerHTML=['s1','s2','s3','s4','s5','s6'].map(function(s){return '<button type="button" data-screen="'+s+'" aria-pressed="'+(screen===s)+'">'+t(s)+'</button>';}).join('');
  document.getElementById('screen').innerHTML={s1:s1,s2:s2,s3:s3,s4:s4,s5:s5,s6:s6}[screen]();
  document.getElementById('why').innerHTML=[['w1','w1p'],['w2','w2p'],['w3','w3p'],['w4','w4p']].map(function(w){return '<div><b>'+t(w[0])+'</b><p>'+t(w[1])+'</p></div>';}).join('');
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-lang],[data-screen],[data-kind],[data-filter],[data-approve],[data-four],.switch');if(!b)return;
  if(b.classList.contains('switch')){b.setAttribute('aria-checked',b.getAttribute('aria-checked')!=='true');return;}
  if(b.dataset.lang){lang=b.dataset.lang;try{localStorage.setItem('wfoApprLang',lang);}catch(x){}}
  else if(b.dataset.screen){screen=b.dataset.screen;approved=false;window.scrollTo(0,0);}
  else if(b.dataset.kind){kind=b.dataset.kind;}
  else if(b.dataset.filter){filter=b.dataset.filter;}
  else if(b.hasAttribute('data-approve')){approved=true;}
  else if(b.hasAttribute('data-four')){fourth=true;}
  render();
});
render();
})();
</script>
