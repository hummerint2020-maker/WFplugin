<title>Shift History</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: the product's own look (indigo header, white rounded cards, Alexandria), as the approved My approvals mockup. One screen at a time (phone or wp-admin), how it works and the decisions beside it. */
:root{
  --bg:#f3f4fa; --card:#ffffff; --ink:#15153a; --sub:#5d6382; --faint:#8b90ab; --line:#e5e7f2; --soft:#f6f7fc;
  --brand:#4836e0; --brand-soft:#eeecff; --hero-a:#16133f; --hero-b:#3a2bc4; --on-brand:#ffffff; --scrim:rgba(15,16,40,.45);
  --ok:#0b7a4b; --ok-bg:#e8f7ef; --warn:#8a4f00; --warn-bg:#fff6e5; --bad:#b4233c; --bad-bg:#fdecef;
  --t-lv:#4836e0; --t-ot:#a3245b; --t-cx:#0b7d74; --t-sw:#d9480f; --t-el:#7a4fd6; --t-fr:#1f6fd1;
  --shadow:0 1px 2px rgba(21,21,58,.06),0 6px 18px rgba(21,21,58,.06);
  --font:"Alexandria",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1020; --card:#191a30; --ink:#ececff; --sub:#a6aacb; --faint:#7d82a6; --line:#2a2c48; --soft:#202240;
  --brand:#8d80ff; --brand-soft:#26244d; --hero-a:#120f33; --hero-b:#2e2496; --on-brand:#0f1020; --scrim:rgba(0,0,0,.6);
  --ok:#57d39a; --ok-bg:#12301f; --warn:#f0b54a; --warn-bg:#2d2412; --bad:#ff8a9c; --bad-bg:#3a1520;
  --t-lv:#8d80ff; --t-ot:#f07aa8; --t-cx:#4fd1c5; --t-sw:#ff9a5c; --t-el:#b69bff; --t-fr:#6aa8ff;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1020; --card:#191a30; --ink:#ececff; --sub:#a6aacb; --faint:#7d82a6; --line:#2a2c48; --soft:#202240;
  --brand:#8d80ff; --brand-soft:#26244d; --hero-a:#120f33; --hero-b:#2e2496; --on-brand:#0f1020; --scrim:rgba(0,0,0,.6);
  --ok:#57d39a; --ok-bg:#12301f; --warn:#f0b54a; --warn-bg:#2d2412; --bad:#ff8a9c; --bad-bg:#3a1520;
  --t-lv:#8d80ff; --t-ot:#f07aa8; --t-cx:#4fd1c5; --t-sw:#ff9a5c; --t-el:#b69bff; --t-fr:#6aa8ff;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.wrap{max-width:1180px;margin-inline:auto;display:grid;gap:16px}
.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.head h1{margin:0;font-size:20px}
.head p{margin:2px 0 0;color:var(--sub);font-size:13px;max-width:75ch}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:9px;padding:5px 12px;cursor:pointer;color:var(--sub)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.stage{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:20px;align-items:start}
.phone{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);overflow:hidden;min-height:720px;display:flex;flex-direction:column}
.bar{padding:16px 16px 18px;color:#fff;background:radial-gradient(120% 140% at 100% 0%,var(--hero-b) 0%,var(--hero-a) 70%)}
.bar small{display:block;opacity:.75;font-size:11.5px}
.bar b{font-size:19px}
.pbody{padding:12px;display:grid;gap:10px;align-content:start;flex:1}
.top{display:flex;align-items:center;gap:8px}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.filters span{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 11px;font-size:12px;color:var(--sub)}
.filters span.on{border-color:var(--brand);color:var(--brand);background:var(--brand-soft);font-weight:600}
.new{border:0;background:var(--brand);color:var(--on-brand);border-radius:12px;min-height:38px;padding:0 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.item{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:11px 13px;display:flex;gap:10px;align-items:center;border-inline-start:4px solid var(--tc)}
.item div{flex:1;min-width:0}
.item b{display:block;font-size:14px}
.item small{display:block;color:var(--sub);font-size:12px}
.item.fresh{outline:2px solid var(--brand)}
.pill{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill.wait{background:var(--warn-bg);color:var(--warn)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.toast{background:var(--ok-bg);color:var(--ok);border-radius:14px;padding:10px 12px;font-weight:600;font-size:13px}
.scrim{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:flex-end}
.sheet{background:var(--card);width:100%;border-radius:22px 22px 0 0;padding:10px 14px 18px;max-height:92%;overflow:auto;display:grid;gap:12px}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}
.shead{display:flex;align-items:center;gap:8px}
.shead h2{margin:0;font-size:16px;flex:1}
.x,.back{border:0;background:var(--soft);border-radius:10px;width:34px;height:34px;cursor:pointer;color:var(--sub);font-size:16px}
.types{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.type{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px;text-align:start;cursor:pointer;display:grid;gap:4px;min-height:96px;align-content:start}
.type:hover{border-color:var(--tc)}
.type i{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-style:normal;font-weight:700;color:var(--on-brand);background:var(--tc);font-size:13px}
.type b{font-size:13.5px}
.type small{color:var(--sub);font-size:11.5px;line-height:1.4}
.type.off{opacity:.55;cursor:not-allowed}
.group{font-size:11.5px;font-weight:600;color:var(--faint);margin-top:2px}
.fld{display:grid;gap:4px}
.fld>span{font-size:12px;font-weight:600;color:var(--sub)}
.inp{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 12px;width:100%;min-width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hint{color:var(--sub);font-size:12px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}
.info{background:var(--soft);border-radius:12px;padding:9px 11px;font-size:12.5px;color:var(--sub)}
.info b{color:var(--ink)}
.send{border:0;background:var(--brand);color:var(--on-brand);border-radius:12px;min-height:44px;font-weight:600;cursor:pointer;width:100%}
.mate{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:9px 11px;cursor:pointer;background:var(--card);text-align:start;width:100%}
.mate[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.mate .av{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:12px;color:var(--on-brand);background:var(--t-sw);flex:0 0 auto}
.mate div{flex:1;min-width:0}
.mate b{display:block;font-size:13.5px}
.mate small{display:block;color:var(--sub);font-size:12px}
.mate.no{opacity:.5;cursor:not-allowed}
.swapline{display:flex;align-items:center;gap:8px;font-size:12.5px}
.swapline .pill{background:var(--soft);color:var(--ink)}
.notes{display:grid;gap:12px}
.note{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px}
.note h3{margin:0 0 6px;font-size:15px}
.note p,.note li{margin:0;color:var(--sub);font-size:13px}
.note ul,.note ol{margin:0;padding-inline-start:18px;display:grid;gap:5px}
.dec{display:grid;gap:8px}
.dec div{display:flex;gap:8px;padding:9px 11px;border:1px solid var(--line);border-radius:12px}
.dec b{color:var(--brand);min-width:18px}
.dec p{margin:0}
.dec small{display:block;color:var(--sub)}
@media (max-width:860px){.stage{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
/* Substitutes mockup additions */
.screens{display:flex;flex-wrap:wrap;gap:6px}
.screens button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;cursor:pointer;color:var(--sub);font-size:13px}
.screens button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}
.stage.wide{grid-template-columns:minmax(0,1fr)}
.sec{display:grid;gap:8px;border:1px solid var(--line);border-radius:16px;padding:12px;background:var(--card)}
.sec h3{margin:0;font-size:14px}
.away{display:flex;gap:10px;align-items:center;background:var(--brand-soft);color:var(--ink);border-radius:14px;padding:10px 12px;font-size:12.5px}
.away b{color:var(--brand)}
.av{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:12px;color:var(--on-brand);background:var(--brand);flex:0 0 auto}
.for{display:inline-flex;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--brand-soft);color:var(--brand)}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px 13px;display:grid;gap:8px;border-inline-start:4px solid var(--tc)}
.card .t{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.card .t b{display:block;font-size:14px}
.card .t small{display:block;color:var(--sub);font-size:12px}
.acts{display:flex;gap:8px}
.acts button{flex:1;border:0;border-radius:11px;min-height:38px;font-weight:600;cursor:pointer}
.acts .y{background:var(--brand);color:var(--on-brand)}
.acts .n{background:var(--bad-bg);color:var(--bad)}
.path{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.path li{display:flex;gap:10px;align-items:flex-start}
.path .dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex:0 0 auto;background:var(--soft);color:var(--sub)}
.path .done .dot{background:var(--ok-bg);color:var(--ok)}
.path .now .dot{background:var(--brand);color:var(--on-brand)}
.path b{display:block;font-size:13px}
.path small{display:block;color:var(--sub);font-size:12px}
.desk{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.desk .wpbar{background:#1d2327;color:#f0f0f1;font-size:12px;padding:7px 14px}
.desk .in{padding:16px 18px;display:grid;gap:14px}
.desk h2{margin:0;font-size:19px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}
th,td{text-align:start;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--sub);font-weight:600;font-size:12px;background:var(--soft)}
td small{display:block;color:var(--sub)}
.st{display:inline-flex;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px}
.st.on{background:var(--ok-bg);color:var(--ok)}
.st.later{background:var(--warn-bg);color:var(--warn)}
.st.off{background:var(--soft);color:var(--sub)}
.lnk{border:0;background:none;color:var(--brand);cursor:pointer;padding:0;font-weight:600}
.lnk.bad{color:var(--bad)}
.addf{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
.btn{border:0;background:var(--brand);color:var(--on-brand);border-radius:10px;min-height:38px;padding:0 16px;font-weight:600;cursor:pointer}
.opt{display:grid;gap:6px;padding:12px;border:1px solid var(--line);border-radius:14px}
.opt b{font-size:13.5px}
.opt label{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink)}
.opt small{color:var(--sub);font-size:12px}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:9px 11px;font-size:12.5px}
.push{background:var(--soft);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;font-size:12.5px}
.push b{display:block}
/* Stage 5 mockup additions */
.prev{display:grid;gap:4px;background:var(--soft);border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--sub)}
.prev b{color:var(--ink);font-size:14px}
.sched{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.sched span{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-size:11px;text-align:center;color:var(--sub)}
.sched span.done{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:14px;text-align:center;color:var(--sub);font-size:12.5px;display:grid;gap:4px;justify-items:center}
.drop .thumb{width:64px;height:84px;border-radius:8px;background:repeating-linear-gradient(45deg,var(--soft) 0 6px,var(--line) 6px 8px)}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:9px 11px;font-size:12.5px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12.5px;margin:0}
.facts dt{color:var(--sub)}
.facts dd{margin:0;color:var(--ink);font-weight:600}
.dl{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:9px 11px;background:var(--card);font-size:13px}
.dl b{flex:1}
.dl .btn{min-height:32px;padding:0 12px;font-size:12.5px}
.letter{background:#fff;color:#1d1d2b;border:1px solid var(--line);border-radius:6px;padding:28px 34px;font-family:"Times New Roman",Georgia,serif;font-size:14px;line-height:1.8;max-width:620px;margin-inline:auto;display:grid;gap:10px;box-shadow:var(--shadow)}
.letter .lh{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #3a2bc4;padding-bottom:8px;font-family:var(--font)}
.letter .lh b{font-size:16px;color:#3a2bc4}
.letter .lh small{color:#666}
.letter .ref{display:flex;justify-content:space-between;font-size:12px;color:#555;font-family:var(--font)}
.letter .sig{display:flex;justify-content:space-between;align-items:flex-end;margin-top:16px;font-family:var(--font);font-size:12.5px}
.letter .stamp{width:84px;height:84px;border-radius:50%;border:2px solid #3a2bc4;color:#3a2bc4;display:grid;place-items:center;font-size:10px;text-align:center;opacity:.7}
.letter .qr{width:64px;height:64px;background:repeating-linear-gradient(90deg,#222 0 4px,#fff 4px 7px),repeating-linear-gradient(0deg,#222 0 4px,#fff 4px 7px);background-blend-mode:difference;border:4px solid #fff;outline:1px solid #ccc}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tag{display:inline-flex;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--soft);color:var(--sub)}
.tag.money{background:var(--ok-bg);color:var(--ok)}
.tag.minus{background:var(--bad-bg);color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.tpl{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--soft);border-radius:10px;padding:10px;white-space:pre-wrap;color:var(--ink);min-height:120px}
</style>
<div class="wrap">
  <div class="head">
    <div><h1 id="h1"></h1><p id="lead"></p></div>
    <div class="seg" role="group" aria-label="Language"><button type="button" data-lang="ar">العربية</button><button type="button" data-lang="en">English</button></div>
  </div>
  <div class="screens" role="group" aria-label="Screens" id="screens"></div>
  <div class="stage wide" id="stage">
    <div id="screen"></div>
    <div class="notes" id="notes"></div>
  </div>
</div>

var lang='ar',scr=1;
function t(k){return (T[k]||{})[lang]||k;}
function f(label,inner){return '<label class="fld"><span>'+label+'</span>'+inner+'</label>';}
function desk(path,inner){return '<div class="desk"><div class="wpbar">'+t(path)+'</div><div class="in">'+inner+'</div></div>';}
function table(){return '<div class="tbl"><table><thead><tr><th>'+t('th1')+'</th><th>'+t('th2')+'</th><th>'+t('th3')+'</th><th>'+t('th4')+'</th><th>'+t('th5')+'</th><th></th></tr></thead><tbody>'
  +[['r1','later'],['r2','on'],['r3','off']].map(function(r){return '<tr><td>'+t(r[0]+'a')+'</td><td>'+t(r[0]+'b')+'</td><td><b>'+t(r[0]+'c')+'</b></td><td>'+t(r[0]+'d')+'</td><td>'+t(r[0]+'e')+'</td><td>'+(r[0]!=='r3'?'<span class="st '+r[1]+'">'+t(r[0]+'s')+'</span>':'')+'</td></tr>';}).join('')+'</tbody></table></div>';}
function form(withPast){return '<div class="sec"><h3>'+t('chg')+'</h3><div class="addf">'+f(t('f_shift'),'<select class="inp" id="s1"><option>'+t('r1c')+'</option><option>'+t('r2c')+'</option></select>')+f(t('f_from'),'<input class="inp" id="s2" type="date" value="'+(withPast?'2026-10-20':'2026-11-01')+'">')+f(t('f_why'),'<input class="inp" id="s3" type="text">')+'<button type="button" class="btn">'+t('save')+'</button></div><p class="hint">'+t('f_hint')+'</p>'+(withPast?'<div class="warnbox">'+t('past')+'</div>':'')+'</div>';}
function s1(){return desk('wp1','<h2>'+t('hist')+'</h2>'+table()+form(false));}
function s2(){return desk('wp1',form(true)+table());}
function s3(){return desk('sc','<div class="addf">'+f(t('e_start'),'<input class="inp" id="t1" type="time" value="08:30">')+f(t('e_end'),'<input class="inp" id="t2" type="time" value="16:30">')+f(t('e_grace'),'<input class="inp" id="t3" type="number" value="10">')+f(t('e_from'),'<input class="inp" id="t4" type="date" value="2026-11-01">')+'<button type="button" class="btn">'+t('save')+'</button></div><div class="info">'+t('e_hint')+'</div><div class="sec"><h3>'+t('e_ver')+'</h3><p class="hint">'+t('v1')+'</p><p class="hint">'+t('v2')+'</p></div>');}
function s4(){return desk('rp','<div class="tbl"><table><thead><tr>'+['rh1','rh2','rh3','rh4','rh5','rh6'].map(function(h){return '<th>'+t(h)+'</th>';}).join('')+'</tr></thead><tbody><tr><td>'+t('d1')+'</td><td>'+t('d1s')+'</td><td>14:05</td><td>22:00</td><td>—</td><td>—</td></tr><tr><td>'+t('d2')+'</td><td>'+t('d2s')+'</td><td>09:10</td><td>17:00</td><td>10 '+(lang==='ar'?'د':'min')+'</td><td>—</td></tr></tbody></table></div><div class="info">'+t('rp_note')+'</div>');}
function render(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  document.getElementById('h1').textContent=t('h1');document.getElementById('lead').textContent=t('lead');
  document.querySelectorAll('[data-lang]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.lang===lang));});
  document.getElementById('screens').innerHTML=[1,2,3,4].map(function(i){return '<button type="button" data-scr="'+i+'" aria-pressed="'+(scr===i)+'">'+t('s'+i)+'</button>';}).join('');
  document.getElementById('screen').innerHTML=[s1,s2,s3,s4][scr-1]();
  document.getElementById('notes').innerHTML='<div class="note"><h3>'+t('n1')+'</h3><ul><li>'+t('n1a')+'</li><li>'+t('n1b')+'</li><li>'+t('n1c')+'</li><li>'+t('n1d')+'</li><li>'+t('n1e')+'</li></ul></div>'
   +'<div class="note"><h3>'+t('dq')+'</h3><div class="dec">'+[1,2,3].map(function(i){return '<div><b>'+(lang==='ar'?'٠١٢٣٤٥٦٧٨٩'[i]:i)+'</b><p>'+t('q'+i)+'<small>'+t('q'+i+'a')+'</small></p></div>';}).join('')+'</div></div>';
}
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var d=b.dataset;if(d.lang)lang=d.lang;else if(d.scr)scr=+d.scr;else return;render();});
render();
</script>
