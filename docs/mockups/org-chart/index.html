<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>Workforce One Org Chart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700&display=swap">
<style>
/* Layout: the product's own look (indigo hero, white rounded cards, Alexandria). Desktop: a top-down org chart with a person panel. Phone and app: browse one person at a time (managers above, reports below). */
:root{
  --bg:#f3f4fa; --card:#ffffff; --ink:#15153a; --sub:#5d6382; --faint:#8b90ab; --line:#e5e7f2; --soft:#f6f7fc;
  --brand:#4836e0; --brand-2:#6d5cff; --brand-soft:#eeecff; --hero-a:#16133f; --hero-b:#3a2bc4; --hero-ink:#ffffff;
  --link:#c9cdf0; --warn:#a15c00; --warn-bg:#fff6e5; --warn-line:#f6d79b; --ok:#0b7a4b; --ok-bg:#e8f7ef;
  --shadow:0 1px 2px rgba(21,21,58,.06),0 6px 18px rgba(21,21,58,.06);
  --d-exec:#4836e0; --d-sales:#d9480f; --d-ops:#0b7d74; --d-fin:#2f855a; --d-it:#1f6fd1; --d-none:#7a7f99;
  --font:"Alexandria",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1020; --card:#191a30; --ink:#ececff; --sub:#a6aacb; --faint:#7d82a6; --line:#2a2c48; --soft:#202240;
  --brand:#8d80ff; --brand-2:#a99fff; --brand-soft:#26244d; --hero-a:#120f33; --hero-b:#2e2496; --link:#3a3d63;
  --warn:#f0b54a; --warn-bg:#2d2412; --warn-line:#5a4520; --ok:#57d39a; --ok-bg:#12301f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1020; --card:#191a30; --ink:#ececff; --sub:#a6aacb; --faint:#7d82a6; --line:#2a2c48; --soft:#202240;
  --brand:#8d80ff; --brand-2:#a99fff; --brand-soft:#26244d; --hero-a:#120f33; --hero-b:#2e2496; --link:#3a3d63;
  --warn:#f0b54a; --warn-bg:#2d2412; --warn-line:#5a4520; --ok:#57d39a; --ok-bg:#12301f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;padding-inline:16px;padding-block:18px 48px}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:1200px;margin-inline:auto;display:grid;gap:16px}

/* page head */
.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.head h1{margin:0;font-size:20px;font-weight:700}
.head p{margin:2px 0 0;color:var(--sub);font-size:13px;max-width:70ch}
.lang{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.lang button{border:0;background:none;border-radius:9px;padding:5px 12px;cursor:pointer;color:var(--sub)}
.lang button[aria-pressed="true"]{background:var(--brand);color:#fff}
.screens{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.screens::-webkit-scrollbar{display:none}
.screens button{flex:0 0 auto;white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;cursor:pointer;color:var(--sub);font-size:13px}
.screens button[aria-pressed="true"]{border-color:var(--brand);color:var(--brand);background:var(--brand-soft);font-weight:600}

/* hero (as the plugin's admin pages) */
.hero{border-radius:22px;padding:22px 24px;color:var(--hero-ink);background:radial-gradient(120% 140% at 100% 0%,var(--hero-b) 0%,var(--hero-a) 60%);display:grid;gap:16px;box-shadow:var(--shadow)}
.hero .crumb{font-size:12px;opacity:.75}
.hero h2{margin:2px 0 0;font-size:26px;font-weight:600;letter-spacing:-.01em}
.hero p{margin:4px 0 0;opacity:.8;max-width:60ch;font-size:13.5px}
.kpis{display:flex;flex-wrap:wrap;gap:8px}
.kpi{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:8px 14px;display:grid;min-width:110px}
.kpi b{font-size:20px;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi span{font-size:11.5px;opacity:.8}
.kpi.warn{background:rgba(255,190,80,.16);border-color:rgba(255,190,80,.4)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;background:#fff;color:#15153a;border-radius:12px;padding:0 12px;min-height:42px}
.search input{border:0;outline:0;background:none;font:inherit;flex:1;min-width:0;color:inherit}
.hbtn{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;border-radius:12px;padding:0 14px;min-height:42px;cursor:pointer;white-space:nowrap}
.hbtn.solid{background:#fff;color:var(--hero-a);border-color:#fff;font-weight:600}

/* attention strip */
.attn{display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:16px;padding:12px 14px;color:var(--warn)}
.attn b{font-weight:600}
.attn .who-row{display:flex;flex-wrap:wrap;gap:8px;margin-inline-start:auto}
.chipbtn{display:inline-flex;align-items:center;gap:8px;background:var(--card);color:var(--ink);border:1px solid var(--warn-line);border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;font-size:13px}
[dir="rtl"] .chipbtn{padding:4px 4px 4px 12px}

/* avatars */
.av{flex:0 0 auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;color:#fff;box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--ring,transparent)}
.av.s{width:28px;height:28px;font-size:11px;box-shadow:0 0 0 2px var(--card)}
.av.l{width:64px;height:64px;font-size:20px}

/* desktop chart */
.board{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:start}
.canvas{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:auto;position:relative;min-height:520px}
.canvas .bar{position:sticky;top:0;inset-inline:0;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:linear-gradient(var(--card),var(--card) 70%,transparent);z-index:2}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--sub)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:5px;vertical-align:1px}
.zoom{display:flex;gap:4px}
.zoom button{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--sub)}
.org{padding:10px 24px 32px;width:max-content;min-width:100%;transform-origin:top center}
.org ul{display:flex;justify-content:center;padding:0;margin:0;list-style:none;position:relative;padding-top:22px}
.org>ul{padding-top:0}
.org li{position:relative;padding:22px 6px 0;display:flex;flex-direction:column;align-items:center}
.org>ul>li{padding-top:0}
/* connectors */
.org li::before,.org li::after{content:"";position:absolute;top:0;width:50%;height:22px;border-top:2px solid var(--link)}
.org li::before{right:50%} .org li::after{left:50%;border-left:2px solid var(--link)}
.org li:only-child::before,.org li:only-child::after{display:none}
.org li:only-child{padding-top:22px}
.org li:only-child>.pc::before{content:"";position:absolute;top:-22px;left:50%;height:22px;border-left:2px solid var(--link)}
.org li:first-child::before,.org li:last-child::after{border:0}
.org li:last-child::before{border-right:2px solid var(--link);border-radius:0 12px 0 0}
.org li:first-child::after{border-radius:12px 0 0 0}
.org ul ul::before{content:"";position:absolute;top:0;left:50%;height:22px;border-left:2px solid var(--link)}
.org>ul>li::before,.org>ul>li::after{display:none}
.org>ul>li{padding-top:0!important}
.org>ul>li>.pc::before{display:none}
/* The connectors are drawn left to right; in Arabic the cards keep right-to-left text and the order is mirrored with flex. */
.org{direction:ltr}
[dir="rtl"] .org ul{flex-direction:row-reverse}
[dir="rtl"] .org li:first-child::before,[dir="rtl"] .org li:last-child::after{border-top:2px solid var(--link)}
[dir="rtl"] .org li:last-child::before{border-right:0;border-radius:0}
[dir="rtl"] .org li:first-child::after{border-radius:0}
[dir="rtl"] .org li:first-child::after{border:0}
[dir="rtl"] .org li:last-child::before{border:0}
[dir="rtl"] .org li:first-child::before{border-top:2px solid var(--link);border-right:2px solid var(--link);border-radius:0 12px 0 0}
[dir="rtl"] .org li:last-child::after{border-top:2px solid var(--link);border-left:2px solid var(--link);border-radius:12px 0 0 0}
[dir="rtl"] .org li:only-child::before,[dir="rtl"] .org li:only-child::after{display:none}
[dir="rtl"] .org .pc,[dir="rtl"] .org .leaf{direction:rtl}
/* person card */
.pc{position:relative;width:172px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 12px 10px;display:grid;justify-items:center;gap:6px;text-align:center;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s}
.pc:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.pc.sel{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.pc.dim{opacity:.35}
.pc .top{position:absolute;inset-inline:0;top:0;height:4px;border-radius:16px 16px 0 0;background:var(--dc)}
.pc strong{font-size:13.5px;font-weight:600;line-height:1.3}
.pc small{font-size:11.5px;color:var(--sub);line-height:1.35}
.pc .dept{font-size:10.5px;font-weight:600;color:var(--dc);background:color-mix(in srgb,var(--dc) 12%,transparent);border-radius:999px;padding:1px 8px}
.pc .more{position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);border:1px solid var(--line);background:var(--card);border-radius:999px;font-size:11px;font-weight:600;color:var(--sub);padding:1px 9px;cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums}
.pc .more[aria-expanded="true"]{color:var(--brand);border-color:var(--brand)}
/* last level: a stacked list instead of a wide row */
.stack{display:grid;gap:6px;margin-top:22px;position:relative;padding-left:14px}
.stack::before{content:"";position:absolute;top:-22px;bottom:20px;left:0;border-left:2px solid var(--link)}
.leaf{position:relative;display:flex;align-items:center;gap:8px;width:170px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 8px;cursor:pointer;text-align:start}
.leaf::before{content:"";position:absolute;top:50%;left:-15px;width:14px;border-top:2px solid var(--link)}
.leaf.sel{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.leaf.dim{opacity:.35}
.leaf span{min-width:0}
.leaf b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leaf small{display:block;font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* person panel */
.panel{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:18px;display:grid;gap:14px;position:sticky;top:12px}
.panel .who{display:grid;justify-items:center;text-align:center;gap:6px}
.panel .who strong{font-size:16px}
.panel .who small{color:var(--sub)}
.facts{display:grid;gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.facts div{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;font-size:13px}
.facts div+div{border-top:1px solid var(--line)}
.facts span{color:var(--sub)}
.facts b{font-weight:600;text-align:end}
.line{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.line .sep{color:var(--faint)}
.pbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:40px;padding:0 12px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.label{font-size:11.5px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
[dir="rtl"] .label{letter-spacing:0}

/* browse (phone / app) */
.browse{display:grid;gap:12px}
.ups{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.ups::-webkit-scrollbar{display:none}
.up{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px;cursor:pointer;white-space:nowrap;font-size:12.5px;flex:0 0 auto}
[dir="rtl"] .up{padding:3px 3px 3px 10px}
.ups .sep{color:var(--faint);flex:0 0 auto}
.focus{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:18px;display:grid;justify-items:center;text-align:center;gap:6px;position:relative;overflow:hidden}
.focus::before{content:"";position:absolute;inset-inline:0;top:0;height:64px;background:linear-gradient(135deg,var(--dc),color-mix(in srgb,var(--dc) 55%,#fff))}
.focus .av{position:relative;margin-top:22px}
.focus strong{font-size:17px}
.focus small{color:var(--sub)}
.focus .stats{display:flex;gap:8px;margin-top:6px}
.focus .stats span{background:var(--soft);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--sub)}
.list{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.list h4{margin:0;padding:12px 14px 6px;font-size:13px;color:var(--sub);font-weight:600}
.row{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:10px 14px;cursor:pointer;text-align:start}
.row+.row{border-top:1px solid var(--line)}
.row span.t{flex:1;min-width:0}
.row b{display:block;font-weight:600;font-size:13.5px}
.row small{display:block;color:var(--sub);font-size:12px}
.pill{font-size:11.5px;font-weight:600;color:var(--brand);background:var(--brand-soft);border-radius:999px;padding:2px 9px;white-space:nowrap}
.chev{color:var(--faint)}
.mates{display:flex;gap:10px;overflow-x:auto;padding:4px 14px 14px;scrollbar-width:none}
.mates button{flex:0 0 72px;border:0;background:none;display:grid;justify-items:center;gap:4px;font-size:11.5px;cursor:pointer;color:var(--ink)}

/* phone frame */
.phonewrap{display:grid;justify-items:center}
.phone{width:min(380px,100%);border:10px solid #101124;border-radius:40px;overflow:hidden;background:var(--bg)}
.ph-head{background:radial-gradient(120% 140% at 100% 0%,var(--hero-b),var(--hero-a) 65%);color:#fff;padding:20px 16px 18px}
.ph-head small{opacity:.75;font-size:11px}
.ph-head h5{margin:2px 0 0;font-size:19px;font-weight:600}
.ph-body{padding:12px;display:grid;gap:12px;min-height:520px;align-content:start}
.ph-nav{display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);padding:10px 4px 14px;font-size:10.5px;color:var(--faint)}
.ph-nav .on{color:var(--brand);font-weight:600}

/* settings and forms */
.sheet{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.sheet h3{margin:0;padding:16px 18px 4px;font-size:16px}
.sheet .intro{margin:0;padding:0 18px 12px;color:var(--sub);font-size:13px}
.opt{display:grid;grid-template-columns:240px 1fr;gap:16px;padding:16px 18px;border-top:1px solid var(--line)}
.opt>.k{font-weight:600}
.opt>.k small{display:block;font-weight:400;color:var(--sub);font-size:12px;margin-top:2px}
.choices{display:grid;gap:8px}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer}
.choice.on{border-color:var(--brand);background:var(--brand-soft)}
.choice .dot{flex:0 0 18px;height:18px;border-radius:50%;border:2px solid var(--faint);margin-top:2px;display:grid;place-items:center}
.choice.on .dot{border-color:var(--brand)}
.choice.on .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--brand)}
.choice b{display:block;font-weight:600;font-size:13.5px}
.choice small{display:block;color:var(--sub);font-size:12px}
.toggle{display:inline-flex;align-items:center;gap:10px;font-weight:600}
.toggle i{width:42px;height:24px;border-radius:999px;background:var(--brand);position:relative}
.toggle i::after{content:"";position:absolute;top:3px;inset-inline-end:3px;width:18px;height:18px;border-radius:50%;background:#fff}
.inp{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 12px;min-width:0;width:100%}
.inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.inline .inp{width:90px}
.hint{color:var(--sub);font-size:12px;margin:6px 0 0}
.sug{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sug span{font-size:12px;background:var(--soft);border-radius:999px;padding:3px 10px;color:var(--sub)}
.steps{display:grid;gap:10px}
.step{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.step .n{width:34px;height:34px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700}

/* dialog */
.dlg{position:fixed;inset:0;background:rgba(10,10,30,.5);display:grid;place-items:center;padding:16px;z-index:10}
.dlg[hidden]{display:none}
.dlg .box{background:var(--card);color:var(--ink);border-radius:22px;max-width:460px;width:100%;padding:20px;display:grid;gap:14px;box-shadow:0 30px 70px rgba(0,0,0,.35)}
.dlg h4{margin:0;font-size:17px}
.fld{display:grid;gap:6px}
.fld label{font-size:12.5px;font-weight:600;color:var(--sub)}
.note{border-radius:14px;padding:10px 12px;font-size:13px}
.note.info{background:var(--brand-soft);color:var(--brand)}
.note.warn{background:var(--warn-bg);color:var(--warn)}

.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.why div{background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.why b{display:block;margin-bottom:2px}
.why p{margin:0;color:var(--sub);font-size:13px}

.desk-only{display:block}.phone-only{display:none}
@media (max-width:900px){.board{grid-template-columns:minmax(0,1fr)}.panel{position:static}}
@media (max-width:720px){
  .desk-only{display:none}.phone-only{display:block}
  .hero{padding:18px;border-radius:18px}.hero h2{font-size:22px}
  .kpi{min-width:0;flex:1 1 calc(50% - 8px)}
  .opt{grid-template-columns:minmax(0,1fr);gap:10px}
  .attn .who-row{margin-inline-start:0}
}
@media (prefers-reduced-motion:reduce){.pc{transition:none}}
</style>

<div class="wrap" id="app">
  <div class="head">
    <div><h1 data-t="title"></h1><p data-t="lead"></p></div>
    <div class="lang" role="group" aria-label="Language"><button type="button" id="l-ar" data-lang="ar">عربي</button><button type="button" id="l-en" data-lang="en">English</button></div>
  </div>
  <nav class="screens" id="screens" aria-label="Screens"></nav>
  <div id="screen"></div>
  <div class="why" id="why"></div>
</div>
<div class="dlg" id="dlg" hidden role="dialog" aria-modal="true" aria-labelledby="dlg-t"><div class="box" id="dlg-box"></div></div>

<script>

var DEPT={exec:['--d-exec','الإدارة','Management'],sales:['--d-sales','المبيعات','Sales'],ops:['--d-ops','العمليات','Operations'],fin:['--d-fin','الحسابات','Finance'],it:['--d-it','تكنولوجيا المعلومات','IT'],none:['--d-none','بدون قسم','No department']};
// id, manager, en, ar, title en, title ar, dept, avatar colour
var P=[

 [4,1,'Sara Nabil','سارة نبيل','Finance Manager','مديرة الحسابات','fin'],
 [5,1,'Omar Hamdy','عمر حمدي','IT Manager','مدير تكنولوجيا المعلومات','it'],
 [6,2,'Nour Saeed','نور سعيد','Team Lead · Cairo','قائدة فريق القاهرة','sales'],
 [7,2,'Youssef Gamal','يوسف جمال','Team Lead · Alexandria','قائد فريق إسكندرية','sales'],
 [8,6,'Hana Lotfy','هنا لطفي','Sales Representative','مندوبة مبيعات','sales'],
 [9,6,'Mostafa Samir','مصطفى سمير','Sales Representative','مندوب مبيعات','sales'],

   +'<div class="opt"><div class="k">'+t('l1')+'</div><div class="steps"><div class="step"><span class="n">1</span>'+lv('a1',0)+'</div></div></div>'
   +'<div class="opt"><div class="k">'+t('l2')+'</div><div class="steps"><div class="step"><span class="n">2</span>'+lv('a2',1)+'</div></div></div>'
   +'<div class="opt"><div class="k">'+t('esc')+'</div><div><div class="choices"><div class="choice"><span class="dot"></span><span><b>'+t('esca')+'</b></span></div><div class="choice on"><span class="dot"></span><span><b>'+t('escb')+'</b><span class="inline" style="margin-top:6px"><input class="inp" id="esch" type="number" value="24"><span>'+t('hrs')+'</span></span></span></div></div><p class="hint">'+t('esch')+'</p></div></div></div>';
}

function dialog(){
  var d=document.getElementById('dlg');d.dir=app.dir;
  if(!moving){d.hidden=true;return;}
  var p=by[moving],n=total(moving),from=p[1]?by[p[1]]:null;
  document.getElementById('dlg-box').innerHTML='<h4 id="dlg-t">'+esc(fill(t('dt'),{n:nm(p)}))+'</h4>'
   +'<div class="row" style="padding:0;cursor:default">'+av(p)+'<span class="t"><b>'+esc(nm(p))+'</b><small>'+esc(ti(p))+(from?' · '+esc(nm(from)):'')+'</small></span></div>'
   +'<div class="fld"><label for="d-m">'+t('newm')+'</label><select class="inp" id="d-m">'+[3,2,4,5,6,7,13].filter(function(i){return i!==moving&&i!==p[1];}).map(function(i){return '<option>'+esc(nm(by[i]))+' — '+esc(ti(by[i]))+'</option>';}).join('')+'</select></div>'
   +'<div class="fld"><label for="d-w">'+t('when')+'</label><input class="inp" id="d-w" type="date" value="2026-10-11"></div>'
   +'<div class="fld"><label for="d-r">'+t('reason')+' · '+t('reasonh')+'</label><input class="inp" id="d-r" placeholder="'+esc(t('rph'))+'"></div>'
   +(n?'<div class="note info">'+esc(fill(t('withme'),{k:n}))+'</div>':'')
   +(from?'<div class="note warn">'+esc(fill(t('waiting'),{n:nm(from)}))+'</div>':'')
   +'<p class="hint" style="margin:0">'+t('loop')+'</p>'
   +'<div class="pbtns"><button class="btn" type="button" data-close="1">'+t('cancel')+'</button><button class="btn primary" type="button" data-close="1">'+t('save')+'</button></div>';
  d.hidden=false;var f=document.getElementById('d-m');if(f)f.focus();
}

function render(){
  document.documentElement.lang=lang;app.dir=lang==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-t]').forEach(function(el){el.textContent=t(el.getAttribute('data-t'));});
  document.querySelectorAll('[data-lang]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.lang===lang));});
  document.getElementById('screens').innerHTML=[['chart','s_chart'],['app','s_app'],['set','s_set'],['emp','s_emp'],['appr','s_appr']].map(function(s,i){return '<button type="button" data-screen="'+s[0]+'" aria-pressed="'+(s[0]===screen)+'">'+(i+1)+' · '+t(s[1])+'</button>';}).join('');
  var hadQ=document.activeElement&&document.activeElement.id==='q';
  document.getElementById('screen').innerHTML={chart:sChart,app:sApp,set:sSet,emp:sEmp,appr:sAppr}[screen]();
  if(hadQ){var qi=document.getElementById('q');if(qi){qi.focus();qi.setSelectionRange(qi.value.length,qi.value.length);}}
  document.getElementById('why').innerHTML=[['w1','w1p'],['w2','w2p'],['w3','w3p'],['w4','w4p']].map(function(w){return '<div><b>'+t(w[0])+'</b><p>'+t(w[1])+'</p></div>';}).join('');
  dialog();
}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-lang],[data-screen],[data-open],[data-sel],[data-focus],[data-move],[data-close],[data-zoom]');if(!b)return;
  if(b.dataset.lang){lang=b.dataset.lang;try{localStorage.setItem('wfoOrgLang',lang);}catch(x){}}
  else if(b.dataset.screen){screen=b.dataset.screen;if(screen==='app')focus=6;}
  else if(b.dataset.open){e.stopPropagation();var id=+b.dataset.open;open[id]=!open[id];}
  else if(b.dataset.move){moving=+b.dataset.move;}
  else if(b.dataset.close){moving=0;}
  else if(b.dataset.zoom){var z=+b.dataset.zoom;zoom=z===0?1:Math.min(1.3,Math.max(.6,zoom+z*.1));}
  else if(b.dataset.focus){focus=+b.dataset.focus;}
  else if(b.dataset.sel){sel=+b.dataset.sel;var k=kids[sel]||[];if(k.length&&!open[sel])open[sel]=1;}
  render();
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&moving){moving=0;render();}
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('pc')){e.preventDefault();e.target.click();}
});
document.getElementById('dlg').addEventListener('click',function(e){if(e.target.id==='dlg'){moving=0;render();}});
document.addEventListener('input',function(e){if(e.target.id==='q'){q=e.target.value;render();}});
render();
})();
</script>
</body></html>
