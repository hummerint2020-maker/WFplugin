<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: a screen switcher on top; wp-admin screens in a WordPress frame, the app screen in a phone frame. The tree is an indented chart that scales to thousands of people. */
:root{
  --page:#eef0f3; --panel:#ffffff; --ink:#1d2327; --muted:#646970; --line:#dcdcde; --soft:#f6f7f7;
  --side:#1d2327; --side-ink:#f0f0f1; --side-muted:#a7aaad; --wp:#2271b1; --wp-ink:#ffffff;
  --brand:#3b2fd0; --brand-soft:#ecebff; --app-bg:#f3f4fb; --app-ink:#14143a;
  --ok:#00a32a; --ok-bg:#edfaef; --warn:#996800; --warn-bg:#fcf9e8; --bad:#b32d2e; --bad-bg:#fcf0f1;
  --line-tree:#c3c4c7;
  --sans:"IBM Plex Sans","IBM Plex Sans Arabic",-apple-system,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#121417; --panel:#1c2024; --ink:#e7e9ea; --muted:#a2a8ad; --line:#30363b; --soft:#23292e;
  --side:#0f1214; --side-ink:#e7e9ea; --side-muted:#8d949a; --wp:#4f94d4; --wp-ink:#0b1620;
  --brand:#8f87ff; --brand-soft:#26244a; --app-bg:#15162a; --app-ink:#e8e8ff;
  --ok:#5cc46e; --ok-bg:#16301c; --warn:#e2b84b; --warn-bg:#2e2712; --bad:#f07f80; --bad-bg:#3a1a1b; --line-tree:#4a5157; color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#121417; --panel:#1c2024; --ink:#e7e9ea; --muted:#a2a8ad; --line:#30363b; --soft:#23292e;
  --side:#0f1214; --side-ink:#e7e9ea; --side-muted:#8d949a; --wp:#4f94d4; --wp-ink:#0b1620;
  --brand:#8f87ff; --brand-soft:#26244a; --app-bg:#15162a; --app-ink:#e8e8ff;
  --ok:#5cc46e; --ok-bg:#16301c; --warn:#e2b84b; --warn-bg:#2e2712; --bad:#f07f80; --bad-bg:#3a1a1b; --line-tree:#4a5157; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1180px;margin-inline:auto;display:grid;gap:16px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
h1{margin:0;font-size:22px;font-weight:600;text-wrap:balance}
.lead{margin:4px 0 0;color:var(--muted);max-width:72ch}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;color:var(--ink);font:inherit;padding:6px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--wp);color:var(--wp-ink)}
.screens{display:flex;flex-wrap:wrap;gap:6px}
.screens button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.screens button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--wp);outline-offset:2px}

/* wp-admin frame */
.frame{display:grid;grid-template-columns:170px 1fr;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.side{background:var(--side);color:var(--side-ink);padding-block:8px;font-size:13px}
.side .app{background:var(--wp);color:#fff;font-weight:600;padding:8px 12px}
.side ul{list-style:none;margin:0;padding:4px 0}
.side li{padding:5px 14px;color:var(--side-ink)}
.side li.cur{font-weight:700;box-shadow:inset 3px 0 0 var(--wp)}
[dir="rtl"] .side li.cur{box-shadow:inset -3px 0 0 var(--wp)}
.work{padding:16px 20px 22px;min-width:0;display:grid;gap:14px;align-content:start}
.crumb{font-size:12px;color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line)}
.tabs span{font-size:13px;font-weight:600;color:var(--muted);background:var(--soft);border:1px solid var(--line);border-bottom:0;border-radius:4px 4px 0 0;padding:6px 11px;margin-bottom:-1px}
.tabs span.on{background:var(--panel);color:var(--ink)}
.work h2{margin:0;font-size:22px;font-weight:500}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:inherit;font-size:13px;border:1px solid var(--wp);color:var(--wp);background:var(--panel);border-radius:4px;padding:5px 12px;cursor:pointer}
.btn.primary{background:var(--wp);color:var(--wp-ink)}
.input{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:4px;padding:6px 10px;min-width:0}

/* summary chips */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--panel)}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat.warn{border-color:var(--warn);background:var(--warn-bg)}
.stat.warn b,.stat.warn span{color:var(--warn)}

.cols{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:14px;align-items:start}
.card{border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.card h3{margin:0;font-size:14px;padding:10px 12px;border-bottom:1px solid var(--line)}
.issues{list-style:none;margin:0;padding:6px 0}
.issues li{padding:8px 12px;display:grid;gap:2px;border-bottom:1px solid var(--line)}
.issues li:last-child{border-bottom:0}
.issues .k{font-size:12px;font-weight:600}
.issues .k.warn{color:var(--warn)} .issues .k.bad{color:var(--bad)}

/* the tree */
.tree{padding:10px 12px 14px;overflow-x:auto}
.tree ul{list-style:none;margin:0;padding:0}
.tree ul ul{margin-inline-start:22px;padding-inline-start:16px;border-inline-start:1.5px solid var(--line-tree)}
.tree li{position:relative;padding-top:8px}
.tree ul ul>li::before{content:"";position:absolute;inset-inline-start:-16px;top:30px;width:14px;border-top:1.5px solid var(--line-tree)}
.node{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:7px 10px;min-width:250px;max-width:100%}
.node.hit{outline:2px solid var(--brand);outline-offset:1px}
.node.dim{opacity:.45}
.av{flex:0 0 32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.who{min-width:0;flex:1}
.who strong{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnt{font-size:11.5px;font-weight:600;color:var(--muted);background:var(--soft);border-radius:999px;padding:2px 8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tog{all:unset;cursor:pointer;width:22px;height:22px;display:grid;place-items:center;border-radius:4px;color:var(--muted);font-size:13px}
.tog:hover{background:var(--soft)}
.flag{font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--warn-bg);color:var(--warn);white-space:nowrap}
.mv{all:unset;cursor:pointer;font-size:12px;color:var(--wp);padding:2px 6px;border-radius:4px}
.mv:hover{background:var(--soft)}

/* dialog */
.dlg{position:fixed;inset:0;background:rgba(10,12,16,.45);display:grid;place-items:center;padding:16px;z-index:5}
.dlg[hidden]{display:none}
.dlg .box{background:var(--panel);color:var(--ink);border-radius:8px;max-width:440px;width:100%;padding:18px;display:grid;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.dlg h4{margin:0;font-size:16px}
.field{display:grid;gap:4px}
.field label{font-size:12.5px;font-weight:600}
.note{border-radius:6px;padding:9px 11px;font-size:13px}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note.ok{background:var(--ok-bg);color:var(--ok)}
.note.info{background:var(--brand-soft);color:var(--brand)}

/* settings form */
.form{display:grid;gap:0;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.fr{display:grid;grid-template-columns:230px 1fr;gap:16px;padding:14px 16px;border-bottom:1px solid var(--line)}
.fr:last-child{border-bottom:0}
.fr>label,.fr>.lb{font-weight:600}
.opts{display:grid;gap:6px}
.opts label{display:flex;gap:8px;align-items:flex-start}
.opts small{display:block;color:var(--muted)}
.sw{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.sw i{width:34px;height:20px;border-radius:999px;background:var(--wp);position:relative;display:inline-block}
.sw i::after{content:"";position:absolute;top:3px;inset-inline-end:3px;width:14px;height:14px;border-radius:50%;background:#fff}

/* phone */
.phone{width:min(360px,100%);margin-inline:auto;border:10px solid #1d1f2b;border-radius:34px;overflow:hidden;background:var(--app-bg);color:var(--app-ink)}
.ph-head{background:linear-gradient(135deg,#25206b,#3b2fd0);color:#fff;padding:18px 16px 16px}
.ph-head small{opacity:.8;font-size:11px}
.ph-head h5{margin:2px 0 0;font-size:18px}
.ph-body{padding:12px;display:grid;gap:10px}
.ph-card{background:var(--panel);color:var(--ink);border-radius:14px;padding:12px;display:grid;gap:8px}
.ph-card .t{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
[dir="rtl"] .ph-card .t{letter-spacing:0}
.chain{display:grid;gap:0}
.chain .p{display:flex;align-items:center;gap:10px;padding:6px 0}
.chain .p+.p{border-top:1px dashed var(--line)}
.chain .me{font-weight:700}
.chain .me .who small{color:var(--brand)}
.mini{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.mini .m{flex:0 0 74px;text-align:center;font-size:11.5px}
.mini .av{margin-inline:auto;margin-bottom:4px}
.ph-nav{display:flex;justify-content:space-around;background:var(--panel);color:var(--muted);font-size:10.5px;padding:8px 4px 12px;border-top:1px solid var(--line)}
.ph-nav .on{color:var(--brand);font-weight:700}

.foot{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.foot .card{padding:12px 14px;display:grid;gap:4px}
.foot h4{margin:0;font-size:14px}
.foot p{margin:0;color:var(--muted)}

@media (max-width:860px){
  .frame{grid-template-columns:1fr} .side{display:none}
  .cols{grid-template-columns:1fr}
  .fr{grid-template-columns:1fr;gap:6px}
  .node{min-width:0}
}
</style>

<div class="wrap" id="app">
  <div class="top">
    <div><h1 data-t="title"></h1><p class="lead" data-t="lead"></p></div>

  </div>
  <div class="screens" role="group" aria-label="Screens" id="screens"></div>
  <div id="screen"></div>
  <div class="foot" id="foot"></div>
</div>

<div class="dlg" id="dlg" hidden role="dialog" aria-modal="true" aria-labelledby="dlg-t">
  <div class="box" id="dlg-box"></div>
</div>

 esch:{en:'The first manager is told it moved; the request keeps its history. Shown only when the chart is on.',ar:'المدير الأول بيتبلّغ إنه اتحوّل، والطلب بيحتفظ بتاريخه. بيظهر بس لما الهيكل مفعّل.'},
 // app
 apptitle:{en:'My team',ar:'فريقي'},
 myline:{en:'My reporting line',ar:'خط التبعية بتاعي'},
 mates:{en:'My teammates (same manager)',ar:'زمايلي (نفس المدير)'},
 mine:{en:'Reports to me',ar:'التابعين ليا'},
 mgrnote:{en:'A manager sees their people here; employees see what the setting allows.',ar:'المدير بيشوف الناس اللي تحته هنا، والموظف بيشوف اللي الإعدادات تسمح بيه.'},
 n_home:{en:'Home',ar:'الرئيسية'},n_sched:{en:'Schedule',ar:'الجدول'},n_sign:{en:'Sign In',ar:'الحضور'},n_team:{en:'Team',ar:'الفريق'},n_more:{en:'More',ar:'المزيد'},
 f1:{en:'One source',ar:'مصدر واحد'},f1p:{en:'The chart is the direct manager already used by approvals, so nothing is entered twice.',ar:'الهيكل هو نفس «المدير المباشر» اللي بتستخدمه الموافقات، فمفيش حاجة بتتدخل مرتين.'},
 f2:{en:'Each company chooses',ar:'كل شركة تختار'},f2p:{en:'Who sees the chart, what managers see, the extra approval level and escalation are settings.',ar:'مين يشوف الهيكل، والمدير يشوف إيه، ومستوى الموافقة الإضافي والتصعيد كلها إعدادات.'},
 f3:{en:'Large companies',ar:'الشركات الكبيرة'},f3p:{en:'The chart opens collapsed and loads a branch when it is opened, so 3,000 people stay fast.',ar:'الشجرة بتفتح مقفولة وبتحمّل كل فرع لما يتفتح، فـ ٣٠٠٠ موظف يفضلوا سريعين.'},
 f4:{en:'Every change is kept',ar:'كل تغيير متسجل'},f4p:{en:'Moving someone needs a reason and is in the Audit Log; requests waiting on the old manager move with them.',ar:'النقل محتاج سبب وبيتسجل في سجل التغييرات، والطلبات اللي مستنية المدير القديم بتتحول معاه.'}
};

var lang='ar',screen='chart',open={1:1,2:1,6:1},q='',moving=0;
try{var sl=localStorage.getItem('wfoOrgLang');if(sl==='ar'||sl==='en')lang=sl;}catch(e){}
var app=document.getElementById('app');
function t(k){return T[k][lang];}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function nm(p){return lang==='ar'?p[3]:p[2];} function ti(p){return lang==='ar'?p[5]:p[4];}
function ini(p){var s=p[2].split(' ');return s[0][0]+s[1][0];}
function av(p,size){return '<span class="av" style="background:'+COLORS[p[0]%COLORS.length]+(size?';width:'+size+'px;height:'+size+'px;flex-basis:'+size+'px':'')+'">'+ini(p)+'</span>';}
function fill(s,o){return s.replace(/\{(\w)\}/g,function(_,k){return o[k];});}

function frame(cur,sub,tabs,inner){
  var items=[['h','الرئيسية','Home'],['p','الموظفون','People'],['a','الحضور','Attendance'],['r','الطلبات','Requests'],['s','الجدول والأماكن','Schedule & places'],['y','المرتبات','Pay'],['e','التفاعل','Engagement'],['x','الإعدادات','Settings']];
  return '<div class="frame"><nav class="side" aria-label="wp-admin"><div class="app">Workforce One</div><ul>'+items.map(function(i){return '<li'+(i[0]===cur?' class="cur"':'')+'>'+(lang==='ar'?i[1]:i[2])+'</li>';}).join('')+'</ul></nav>'
   +'<div class="work"><div class="crumb">'+esc(sub)+'</div><div class="tabs">'+tabs.map(function(x){return '<span'+(x[1]?' class="on"':'')+'>'+esc(x[0])+'</span>';}).join('')+'</div>'+inner+'</div></div>';
}

function matches(p){if(!q)return true;var s=(p[2]+' '+p[3]+' '+p[4]+' '+p[5]).toLowerCase();return s.indexOf(q.toLowerCase())!==-1;}
function subtreeHit(id){var p=byId[id];if(matches(p))return true;return (kids[id]||[]).some(subtreeHit);}
function node(id){
  var p=byId[id],k=kids[id]||[],isOpen=q?true:!!open[id],n=all(id);
  if(q&&!subtreeHit(id))return '';
  var h='<li><div class="node'+(q&&matches(p)?' hit':'')+(q&&!matches(p)?' dim':'')+'">'
   +(k.length?'<button class="tog" type="button" data-tog="'+id+'" aria-expanded="'+isOpen+'" aria-label="'+esc(nm(p))+'">'+(isOpen?'▾':(lang==='ar'?'◂':'▸'))+'</button>':'<span style="width:22px"></span>')
   +av(p)+'<span class="who"><strong>'+esc(nm(p))+'</strong><small>'+esc(ti(p))+'</small></span>'
   +(k.length?'<span class="cnt">'+k.length+' '+t('direct')+(n>k.length?' · '+n+' '+t('reports'):'')+'</span>':'')
   +(id!==1?'<button class="mv" type="button" data-move="'+id+'">'+t('move')+'</button>':'')+'</div>';
  if(k.length&&isOpen)h+='<ul>'+k.map(node).join('')+'</ul>';
  return h+'</li>';
}

function chart(){
  var tabs=[[t('employees')],[t('orgtab'),1],[t('departments')],[t('teams')],[t('branches')]];
  var none=(kids[0]||[]).filter(function(i){return i!==1;});
  var inner='<div class="stats"><div class="stat"><b>'+(P.length-none.length)+'</b><span>'+t('st_people')+'</span></div><div class="stat"><b>'+Object.keys(kids).filter(function(k){return k!=='0';}).length+'</b><span>'+t('st_mgr')+'</span></div><div class="stat"><b>4</b><span>'+t('st_depth')+'</span></div><div class="stat warn"><b>'+none.length+'</b><span>'+t('st_none')+'</span></div></div>'
   +'<div class="row"><input class="input" id="q" type="search" placeholder="'+esc(t('search'))+'" value="'+esc(q)+'" style="flex:1 1 220px"><button class="btn" type="button" data-all="1">'+t('expand')+'</button><button class="btn" type="button" data-all="0">'+t('collapse')+'</button><button class="btn" type="button">'+t('exportx')+'</button><button class="btn" type="button">'+t('importx')+'</button></div>'
   +'<div class="cols"><div class="card"><div class="tree"><ul>'+node(1)+'</ul></div></div>'
   +'<aside class="card"><h3>'+t('issues')+'</h3><ul class="issues">'
   +'<li><span class="k warn">'+t('i1k')+'</span><span class="muted">'+t('i1')+'</span><div class="row">'+none.map(function(i){return '<button class="mv" type="button" data-move="'+i+'">'+esc(nm(byId[i]))+' · '+t('setmgr')+'</button>';}).join('')+'</div></li>'
   +'<li><span class="k">'+t('i2k')+'</span><span class="muted">'+t('i2')+'</span></li>'
   +'<li><span class="k">'+t('i3k')+'</span><span class="muted">'+t('i3')+'</span></li></ul></aside></div>';
  return frame('p','Workforce One › '+t('people'),tabs,inner);
}

function settingsS(){
  var tabs=[[t('features'),1],['Notifications'],['Email'],['Roles & permissions'],['Appearance']];
  var r=function(name,items,sel){return '<div class="opts">'+items.map(function(x,i){return '<label><input type="radio" name="'+name+'"'+(i===sel?' checked':'')+'><span>'+x+'</span></label>';}).join('')+'</div>';};
  var inner='<div class="form">'
   +'<div class="fr"><span class="lb">'+t('orgsec')+'</span><span class="sw"><i aria-hidden="true"></i>'+t('on')+'</span></div>'
   +'<div class="fr"><span class="lb">'+t('seeit')+'</span>'+r('see',[t('see1'),t('see2'),t('see3')],1)+'</div>'
   +'<div class="fr"><span class="lb">'+t('empsee')+'</span>'+r('emp',[t('emp1'),t('emp2')],0)+'</div>'
   +'<div class="fr"><span class="lb">'+t('scope')+'</span><div class="opts">'+r('scope',[t('scope1'),t('scope2')],1).replace('<div class="opts">','').replace(/<\/div>$/,'')+'<small>'+t('scopeh')+'</small></div></div>'
   +'<div class="fr"><span class="lb">'+t('span')+'</span><div class="row"><input class="input" id="span" type="number" value="12" style="width:80px"><span class="muted">'+t('spanu')+'</span></div></div>'
   +'<div class="fr"><span class="lb">'+t('titlereq')+'</span><div class="opts"><label><input type="checkbox"><span>'+t('titlereq1')+'</span></label></div></div>'
   +'</div>';
  return frame('x','Workforce One › '+t('settings'),tabs,inner);
}

function empS(){
  var me=byId[8],chain=[1,2,6];
  var inner='<h2>'+t('editemp')+'</h2><div class="form">'
   +'<div class="fr"><label for="f-n">'+t('name')+'</label><input class="input" id="f-n" value="'+esc(nm(me))+'"></div>'
   +'<div class="fr"><label for="f-t">'+t('jobtitle')+'</label><div class="field"><input class="input" id="f-t" value="'+esc(ti(me))+'" list="jt"><small class="muted">'+t('jtsug')+': '+esc(ti(byId[9]))+' · '+esc(ti(byId[6]))+' · '+esc(ti(byId[17]))+'</small></div></div>'
   +'<div class="fr"><label for="f-m">'+t('manager')+'</label><select class="input" id="f-m"><option>'+esc(nm(byId[6]))+' — '+esc(ti(byId[6]))+'</option></select></div>'
   +'<div class="fr"><span class="lb">'+t('chainl')+'</span><div class="field"><div class="row">'+chain.concat([8]).map(function(i,ix){return (ix?'<span class="muted">'+(lang==='ar'?'‹':'›')+'</span>':'')+'<span class="row" style="gap:6px">'+av(byId[i],24)+'<span'+(i===8?' style="font-weight:700"':'')+'>'+esc(nm(byId[i]))+'</span></span>';}).join(' ')+'</div></div></div>'
   +'</div>';
  return frame('p','Workforce One › '+t('people'),[[t('employees'),1],[t('orgtab')],[t('departments')],[t('teams')],[t('branches')]],inner);
}

function apprS(){
  var sel=function(id,opts,s){return '<select class="input" id="'+id+'">'+opts.map(function(o,i){return '<option'+(i===s?' selected':'')+'>'+o+'</option>';}).join('')+'</select>';};
  var inner='<h2>'+t('wf')+'</h2><div class="form">'
   +'<div class="fr"><label for="a1">'+t('lvl1')+'</label>'+sel('a1',[t('r_sup'),t('r_sup2'),t('r_team'),t('r_emp')],0)+'</div>'
   +'<div class="fr"><label for="a2">'+t('lvl2')+'</label>'+sel('a2',[t('r_sup'),t('r_sup2'),t('r_team'),t('r_emp')],1)+'</div>'
   +'<div class="fr"><span class="lb">'+t('esc')+'</span><div class="opts"><label><input type="radio" name="esc"><span>'+t('esc0')+'</span></label><label><input type="radio" name="esc" checked><span>'+t('esc1')+' <input class="input" id="esch" type="number" value="24" style="width:70px"> '+t('hours')+'</span></label><small>'+t('esch')+'</small></div></div>'
   +'</div>';
  return frame('r','Workforce One › '+t('requests'),[[t('hub')],[t('leaves')],[t('approvals'),1]],inner);
}

function appS(){
  var me=byId[6];
  var line=[1,2,6].map(function(i){var p=byId[i];return '<div class="p'+(i===6?' me':'')+'">'+av(p,30)+'<span class="who"><strong>'+esc(nm(p))+'</strong><small>'+esc(ti(p))+'</small></span></div>';}).join('');
  var mates=[7].map(function(i){var p=byId[i];return '<div class="m">'+av(p,40)+esc(nm(p).split(' ')[0])+'</div>';}).join('');
  var mine=[8,9,10].map(function(i){var p=byId[i];return '<div class="m">'+av(p,40)+esc(nm(p).split(' ')[0])+'</div>';}).join('');
  return '<div class="phone"><div class="ph-head"><small>BA Team · Workforce One</small><h5>'+t('apptitle')+'</h5></div><div class="ph-body">'
   +'<div class="ph-card"><span class="t">'+t('myline')+'</span><div class="chain">'+line+'</div></div>'
   +'<div class="ph-card"><span class="t">'+t('mine')+' · 3</span><div class="mini">'+mine+'</div></div>'
   +'<div class="ph-card"><span class="t">'+t('mates')+'</span><div class="mini">'+mates+'</div></div>'
   +'<p class="note info" style="margin:0">'+t('mgrnote')+'</p></div>'
   +'<div class="ph-nav"><span>'+t('n_home')+'</span><span>'+t('n_sched')+'</span><span>'+t('n_sign')+'</span><span class="on">'+t('n_team')+'</span><span>'+t('n_more')+'</span></div></div>';
}

function dialog(){
  var d=document.getElementById('dlg');
  if(!moving){d.hidden=true;return;}
  var p=byId[moving],n=all(moving),from=p[1]?byId[p[1]]:null;
  document.getElementById('dlg-box').innerHTML='<h4 id="dlg-t">'+esc(fill(t('dlgtitle'),{n:nm(p)}))+'</h4>'
   +'<div class="row">'+av(p)+'<span class="who"><strong>'+esc(nm(p))+'</strong><small>'+esc(ti(p))+(from?' · '+t('from')+' '+esc(nm(from)):' · '+t('nomgr'))+'</small></span></div>'
   +'<div class="field"><label for="d-m">'+t('newmgr')+'</label><select class="input" id="d-m">'+[3,2,4,5,6,7,13].filter(function(i){return i!==moving&&i!==p[1];}).map(function(i){return '<option>'+esc(nm(byId[i]))+' — '+esc(ti(byId[i]))+'</option>';}).join('')+'</select></div>'
   +'<div class="field"><label for="d-w">'+t('when')+'</label><input class="input" id="d-w" type="date" value="2026-10-11"></div>'
   +'<div class="field"><label for="d-r">'+t('reason')+'</label><input class="input" id="d-r" placeholder="'+esc(t('reasonph'))+'"></div>'
   +(n?'<p class="note info" style="margin:0">'+esc(fill(t('moveswith'),{k:n,n:nm(p)}))+'</p>':'')
   +(from?'<p class="note warn" style="margin:0">'+esc(fill(t('pending'),{n:nm(from)}))+'</p>':'')
   +'<p class="muted" style="margin:0;font-size:12.5px">'+t('loop')+'</p>'
   +'<div class="row" style="justify-content:flex-end"><button class="btn" type="button" data-close="1">'+t('cancel')+'</button><button class="btn primary" type="button" data-close="1">'+t('save')+'</button></div>';
  d.hidden=false;
  var f=document.getElementById('d-m');if(f)f.focus();
}

function render(){
  document.documentElement.lang=lang;app.dir=lang==='ar'?'rtl':'ltr';document.getElementById('dlg').dir=app.dir;
  document.querySelectorAll('[data-t]').forEach(function(el){el.textContent=t(el.getAttribute('data-t'));});
  document.querySelectorAll('[data-lang]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.lang===lang));});
  var S=[['chart','s1'],['settings','s2'],['emp','s3'],['appr','s4'],['app','s5']];
  document.getElementById('screens').innerHTML=S.map(function(s){return '<button type="button" data-screen="'+s[0]+'" aria-pressed="'+(s[0]===screen)+'">'+t(s[1])+'</button>';}).join('');
  var hadQ=document.activeElement&&document.activeElement.id==='q';
  document.getElementById('screen').innerHTML={chart:chart,settings:settingsS,emp:empS,appr:apprS,app:appS}[screen]();
  if(hadQ){var qi=document.getElementById('q');qi.focus();qi.setSelectionRange(qi.value.length,qi.value.length);}
  document.getElementById('foot').innerHTML=[['f1','f1p'],['f2','f2p'],['f3','f3p'],['f4','f4p']].map(function(f){return '<div class="card"><h4>'+t(f[0])+'</h4><p>'+t(f[1])+'</p></div>';}).join('');
  dialog();
}

document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.lang){lang=b.dataset.lang;try{localStorage.setItem('wfoOrgLang',lang);}catch(x){}render();}
  else if(b.dataset.screen){screen=b.dataset.screen;render();}
  else if(b.dataset.tog){var id=+b.dataset.tog;open[id]=!open[id];render();}
  else if(b.dataset.all){open={};if(b.dataset.all==='1')Object.keys(kids).forEach(function(k){open[k]=1;});render();}
  else if(b.dataset.move){moving=+b.dataset.move;render();}
  else if(b.dataset.close){moving=0;render();}
});
document.getElementById('dlg').addEventListener('click',function(e){if(e.target.id==='dlg'){moving=0;render();}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&moving){moving=0;render();}});
document.addEventListener('input',function(e){if(e.target.id==='q'){q=e.target.value;render();}});
render();
})();
</script>
</body></html>
